# @package _global_
stage: hpo
run_name: a0
regime: natural
model_path: null

defaults:
  - override /trainer: natural
  - override /tracking: online
  - override /hydra/sweeper: optuna

trainer:
  alpha: 0.0
  input_noise_std: 0.0
  max_epoch: 100
  save: false

hydra:
  sweeper:
    study_name: "jem_a0_${dataset.name}"
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: 42
      n_startup_trials: 4
    direction: minimize
    n_trials: 12
    n_jobs: 1
    params:
      trainer.optimizer.kwargs.lr: tag(log, interval(1e-4, 2e-3))
      trainer.optimizer.kwargs.weight_decay: tag(log, interval(1e-7, 1e-3))
