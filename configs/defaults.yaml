# Study-level defaults: every study (configs/studies/*.yaml) is merged onto this
# file, so a constant lives here once and a study states only what differs.
# Run-level constants (model, trainer) are the schema defaults in experiments/config.py.

seeds: 5                       # D29: seeds 1..5; a study may list seeds instead

grid:                          # a study's grid overrides these axes one by one
  embedding: [legendre]
  alpha: [0, 1e-3, 1e-2, 1e-1, 0.5, 1]   # D45
  eps: [0.1]                   # AT training radius (fraction of the input range); NAT ignores it

# Model settings per embedding, applied to every cell with that embedding.
embeddings:
  hermite:
    born.init_kwargs.init_method: canonical

hpo:
  n_trials: 30
  # key: {log: [lo, hi]} | [lo, hi] (uniform) | {choice: [...]}. weight_decay is
  # fixed at 0, as in every recent sweep; add it here to tune it.
  space:
    trainer.optimizer.kwargs.lr: {log: [1e-5, 1e-1]}

# One radius grid (fractions of the input range) for robustness, detection and
# purification (D3, D20); read by the analysis stage (Phase 5).
budgets: [0.05, 0.1, 0.15, 0.2, 0.3]
