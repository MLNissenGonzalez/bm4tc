# Study-level defaults: every study (configs/studies/*.yaml) is merged onto this
# file, so a constant lives here once and a study states only what differs.
# Run-level constants (model, trainer) are the schema defaults in bm4tc/pipeline/config.py.

seeds: 5                       # D29: seeds 1..5; a study may list seeds instead

grid:                          # a study's grid overrides these axes one by one
  embedding: [legendre]
  alpha: [0, 1e-3, 1e-2, 1e-1, 0.5, 1]   # D45
  eps: [0.1]                   # AT training radius (fraction of the input range); NAT ignores it

# Model settings per embedding, applied to every cell with that embedding.
embeddings:
  hermite:
    born.init_kwargs.init_method: canonical

hpo:
  n_trials: 30
  # key: {log: [lo, hi]} | [lo, hi] (uniform) | {choice: [...]}. weight_decay is
  # 0 and not tuned (OptimizerConfig): norm control does a similar job.
  space:
    trainer.optimizer.kwargs.lr: {log: [1e-5, 1e-1]}

# One radius grid (fractions of the input range) for robustness, detection and
# purification (D3, D20).
budgets: [0.05, 0.1, 0.15, 0.2, 0.3]

# Post-hoc analysis of every seed run (the `analyse` stage), on the test split.
# The settings of the submission's analysis (sweep.py, gibbs.py on MNIST).
analysis:
  attack_steps: 40             # PGD Linf with random start, at every budget
  joint_attack: true           # also attack class and log p(x) jointly (JOINT_PGD)
  rob_ceiling: true            # data-only bound on robust accuracy (two-class data only)
  percentiles: [1, 5, 10, 20]  # detection thresholds: percentiles of clean log p(x)
  purify_delta: [0.1]          # likelihood-purification radius (fraction of the input range)
  purify_steps: 40
  batch_size: 256              # forward chunk size; bounds GPU memory on MNIST
  sweep_purify:                # Gibbs (MPS) / SGLD (JEM) purification (D72); Gibbs is ~99% of the cost
    enabled: false
    sweeps: [1, 3, 6, 10]
    step: 0.05                 # per-sweep Linf move (fraction of the range), not a budget
    subsample: 250             # test points (fixed subset, seed 0); null = all
    gibbs:
      num_bins: 96             # candidate values per feature
      batch_size: 24           # memory: batch_size x num_bins per forward
    sgld:
      steps: 20                # SGLD transitions per sweep
      step_size: 0.01          # fixed for every model (not the training sampler's)
      noise_std: 0.005
      batch_size: 256
