# Spirals, NAT, cold, the default beta ladder (D86).
dataset: spirals
regime: nat
grid:
  arch: [d10r6]
config:
  trainer.max_epoch: 300
  trainer.batch_size: 256
  trainer.patience: 100
analysis:
  sweep_purify:                # D132: windowed Gibbs, attacked adaptively (cheap at 2 features)
    enabled: true
    sweeps: [1, 6]             # E3: the attack was ahead at 1 sweep, behind at 6
    adaptive_seeds: [1]
  attack:
    restarts: 20               # D135: purification does not saturate at 5 on spirals (≈ 1 min per budget);
                               # Gibbs too (D152: ≈ 8 min per restart and budget on a 1080 Ti)
