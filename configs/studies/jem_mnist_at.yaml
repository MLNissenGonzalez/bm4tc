# JEM PGD-AT on full MNIST (D71, D174, D180, D181), warm from jem_mnist_nat's
# beta=0 runs; the same attack, budgets and beta grid as mnist_at. At beta>0 the training
# SGLD is the one selected for the same jem_mnist_nat cell (hparams_from).
dataset: mnist
model: jem
regime: at
init: warm
grid:
  embedding: [raw]
  arch: [d3r40]
  beta: [0, 0.25, 0.5]          # D113, as mnist_at
config:
  trainer.max_epoch: 300       # D181: at 150 (D88) every run was best at the last epoch;
                               # the ramp ends at 70%, so full radius from epoch 210
  trainer.batch_size: 512
  trainer.patience: 8          # validations (eval_every 5): 40 epochs (D88)
hpo:                           # the lr only (D80)
  space:
    trainer.optimizer.kwargs.lr: {log: [1e-6, 1e-4]}   # D181: in [1e-5, 2e-3] every cell picked
                                                       # 1e-5, the objective rising with lr
hparams_from:
  study: jem_mnist_nat
  params: [jem.sampler.step_size, jem.sampler.noise_std, jem.sampler.num_steps]
analysis:
  batch_size: 512              # D133, as mnist_at
  adaptive: {seeds: [1]}       # D129, as mnist_at
  sweep_purify:                # as mnist_at: one SGLD sweep, transfer only; D158: ball 0.3
    enabled: true
    step: 0.3
    sweeps: [1]
    adaptive_seeds: []
