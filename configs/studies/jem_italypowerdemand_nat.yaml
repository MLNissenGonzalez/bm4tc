# JEM baseline on italypowerdemand, NAT, the default beta ladder, cold (D35, D139): a copy of
# jem_mnist12_nat sized to italypowerdemand_nat's rank (D70, D143), on the series' budgets.
# italypowerdemand's pilot has no JEM: its curves are read before jem_italypowerdemand_at is written.
dataset: italypowerdemand
model: jem
regime: nat
grid:
  embedding: [raw]
  arch: [d3r10]
config:
  trainer.max_epoch: 500
  trainer.batch_size: 64
  trainer.patience: 150
  jem.energy_l2: 1.0e-3        # D182: fixed, not tuned. The objective rewards a falling loss_x, so
                               # at beta >= 0.25 the HPO picked the floor of every range and the
                               # energy ran away (D163, D180); 1e-3 is among the healthy picks
hpo:                           # four hparams: 24 trials, each on 5 folds (D148)
  trials_per_param: 6          # D155: 15 (D81) costs ~10 h per study under CV
  space:
    trainer.optimizer.kwargs.lr: {log: [1e-5, 2e-3]}
    jem.sampler.step_size: {log: [1e-3, 3e-1]}
    jem.sampler.noise_std: {log: [1e-3, 3e-2]}
    jem.sampler.num_steps: {choice: [20, 40]}
budgets: [0.01, 0.02, 0.05, 0.1]   # D145
analysis:
  purify_delta: [0.02, 0.05, 0.1]   # D189: below, at and above the AT radius 0.05 (D153)
  sweep_purify:                # D132: one sweep, adaptive on one seed per beta; D189: a window, as D158
    enabled: true
    step: 0.15                 # D189: 1.5x the largest budget (0.1), so one sweep can undo it
    sweeps: [1]
    adaptive_seeds: [1]
