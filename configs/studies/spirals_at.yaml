# Spirals, PGD-AT at the reduced budget (D43), warm from spirals_nat's alpha=0 runs.
dataset: spirals
regime: at
init: warm
grid:
  arch: [d10r6]
  alpha: [0, 1e-2]
config:
  trainer.max_epoch: 200
  trainer.batch_size: 256
  trainer.patience: 20         # validations (eval_every 5): 100 epochs
hpo:                           # the lr only; clean_weight stays 0 (D80)
  space:
    trainer.optimizer.kwargs.lr: {log: [1e-5, 1e-2]}   # warm start: below the cold default range (D81)
