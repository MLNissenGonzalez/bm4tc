# Spirals, PGD-AT at the reduced budget (D43), warm from spirals_nat's beta=0 runs.
dataset: spirals
regime: at
init: warm
grid:
  arch: [d10r6]
  beta: [0, 0.25, 0.5]          # D113: plain AT, β* of E2a under adaptive attack, the last β before the accuracy knee
config:
  trainer.max_epoch: 200
  trainer.batch_size: 256
  trainer.patience: 20         # validations (eval_every 5): 100 epochs
hpo:                           # the lr only (D80)
  space:
    trainer.optimizer.kwargs.lr: {log: [1e-5, 1e-2]}   # warm start: below the cold default range (D81)
analysis:
  sweep_purify:                # D132: windowed Gibbs, attacked adaptively (cheap at 2 features)
    enabled: true
    sweeps: [1, 6]             # E3: the attack was ahead at 1 sweep, behind at 6
    adaptive_seeds: [1]
    adaptive_restarts: 5       # D135: 20 would take hours per budget; noted in the paper
  adaptive:
    restarts: 20               # D135: purification does not saturate at 5 on spirals
