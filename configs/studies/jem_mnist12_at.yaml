# JEM PGD-AT on MNIST 12x12 (D71), warm from jem_mnist12_nat's beta=0 runs; the
# same attack, budgets and beta grid as mnist12_at. beta=0 is MLP-AT; at beta>0 the
# training SGLD is the one selected for the same jem_mnist12_nat cell (hparams_from).
dataset: mnist12
model: jem
regime: at
init: warm
grid:
  embedding: [raw]
  arch: [d3r20, d3r40]
  beta: [0, 0.1, 0.5]
config:
  trainer.max_epoch: 100
  trainer.batch_size: 512
  trainer.patience: 10         # validations (eval_every 5): 50 epochs
hpo:                           # the lr only; clean_weight stays 0 (D80)
  space:
    trainer.optimizer.kwargs.lr: {log: [1e-5, 2e-3]}   # the jem_mnist12_nat range (D81)
hparams_from:
  study: jem_mnist12_nat
  params: [jem.sampler.step_size, jem.sampler.noise_std, jem.sampler.num_steps]
analysis:
  sweep_purify: {enabled: true}
