# MNIST 12x12, NAT, the default beta ladder, cold; log Z pulled to n·ln d / 2 (D84).
dataset: mnist12
regime: nat
grid:
  arch: [d3r10, d3r20, d3r40]
config:
  trainer.max_epoch: 200       # D121: still improving at 200 in the batch pilot
  trainer.batch_size: 512
  trainer.patience: 50
  trainer.norm_control.log_target: "n_features * log(in_dim) / 2"   # pilot A (D84)
hpo:
  trials_per_param: 30         # D157: 15 (D81) left three mnist12_nat cells with a bad lr
analysis:
  sweep_purify:                # D132: one sweep, adaptive on one seed per beta; D158: window 0.3
    enabled: true
    step: 0.3                  # > the largest budget (0.2), so one sweep can undo it
    sweeps: [1]
    adaptive_seeds: [1]
