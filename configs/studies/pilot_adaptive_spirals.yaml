# E3 (docs/evidence.md "Pilots"; docs/adaptive.md §4): the adaptive attacks (D96) on E2c's
# models, against the ceilings (D97). Half of E2c's β ladder, E2c's selected lr
# (hparams_from: outputs/pilot_beta_spirals/hparams.yaml, from the cluster), one seed.
# About 40 min per run on the eGPU (Gibbs is most of it); 6 runs, 3 at a time: ~1.5-2 h.
dataset: spirals
regime: nat
seeds: 1
grid:
  arch: [d10r6]
  beta: [0, 0.01, 0.1, 0.5, 0.9, 1]
config:
  trainer.max_epoch: 300
  trainer.batch_size: 256
  trainer.patience: 100
  tracking.mode: disabled      # a local pilot (eGPU), no W&B
hpo: null
hparams_from:
  study: pilot_beta_spirals
  params: [trainer.optimizer.kwargs.lr]
budgets: [0.05, 0.1, 0.15, 0.2]
analysis:
  joint_attack: false
  percentiles: [5]             # one detection threshold, as E2c was read
  batch_size: 2000             # the whole spirals test split in one batch
  sweep_purify:
    enabled: true
    sweeps: [1, 6]             # the first run showed BPDA+EOT ahead at 1, behind at 6
    gibbs: {batch_size: 256}   # the 250-point subsample in one batch
  adaptive:
    enabled: true
    eot: 8                     # halves Gibbs's cost; the saturation ablation checks it
