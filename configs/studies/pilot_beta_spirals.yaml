# β pilot E2c (plan.md "Beta"): the β ladder of pilot_beta12 on spirals, where TPM
# saw no accuracy knee, only a density knee. One seed, the normal HPO; minutes.
# Also the first --mps launch (D90).
dataset: spirals
regime: nat
seeds: 1
grid:
  arch: [d10r6]
  beta: [0, 0.001, 0.01, 0.03, 0.1, 0.25, 0.5, 0.75, 0.9, 0.97, 0.99, 1]
config:
  trainer.max_epoch: 300
  trainer.batch_size: 256
  trainer.patience: 100
budgets: [0.1]                 # read at ε = 0.1 only
analysis:
  joint_attack: false
