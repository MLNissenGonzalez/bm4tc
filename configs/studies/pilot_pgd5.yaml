# Pilot B (D43, D83): PGD-5 vs PGD-10 (pilot_pgd10) training attacks, mnist12 d3r40
# α=0, cw=0, warm from pilot_norm_zero's α=0 runs. If PGD-5 loses more than ~1 point
# of robust test accuracy under PGD-40 at ε=0.1, keep 10 steps; otherwise
# configs/trainer/at.yaml gets num_steps: 5. Also shows whether cw=0 AT is stable.
dataset: mnist12
regime: at
init: warm
warm_from: pilot_norm_zero
seeds: 3
grid:
  arch: [d3r40]
  alpha: [0]
config:
  trainer.max_epoch: 100
  trainer.batch_size: 512
  trainer.patience: 10         # validations (eval_every 5): 50 epochs
  trainer.norm_control.soft_strength: 1e-3
  trainer.norm_control.log_target: null    # the warm start's own log Z
  trainer.evasion.num_steps: 5        # step size 2.5·ε/5
hpo:
  space:
    trainer.optimizer.kwargs.lr: {log: [1e-5, 1e-2]}
budgets: [0.1]                 # the criterion is rob/test/0.1 (PGD-40)
analysis:
  joint_attack: false
