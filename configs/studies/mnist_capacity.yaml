# MNIST 28x28 capacity sweep, legendre d3, NAT, cold (D44). Must finish before
# mnist_nat / mnist_at, which take the larger of the two passing ranks. Extend r
# up to the 8 GB/cluster memory limit.
dataset: mnist
regime: nat
grid:
  arch: [d3r10, d3r20, d3r40, d3r80]
  alpha: [0, 1]
config:
  trainer.max_epoch: 100
  trainer.batch_size: 512
  trainer.patience: 50
  trainer.norm_control.log_target: "n_features * log(in_dim) / 2"   # pilot A (D84)
archs:                         # memory only, same optimizer steps (D79); analysis chunks follow
  d3r40: {trainer.micro_batch_size: 256}    # ≈ 5 GB per chunk: fits an 11 GB 1080 Ti
  d3r80: {trainer.micro_batch_size: 128}    # ≈ 10 GB per chunk: tight on a 1080 Ti, safe on an RTX 6000
