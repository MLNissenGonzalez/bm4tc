# RECORD (D195): the run of this study is the first POGO variant (Adam or SGD under the exact
# norm contraction), from commit 01bb5732. The code since reads log Z from the centre and refuses Adam:
# do not relaunch it from here.
# Option 2, stage 1 (D190, D192, notes:gauge): ECG200 beta = 1, d3r10, on D148's folds (seeds 1-5),
# ecg200_nat's training settings; one arm per study (the optimiser and the gauge are not
# grid axes, D14). E5: Adam + POGO, the cores kept isometries towards the class core (the
# canonical form centred at the class leg, Z = 1 by the constraint, the gauge never changed),
# on the bonds trimmed to their support (3, 9 at the edges; the same ψ class as d3r10).
# The analysis is cut to what the comparison reads (acc/test; PGD at one radius).
dataset: ecg200
regime: nat
grid:
  arch: [d3r10]
  beta: [1]
config:
  trainer.max_epoch: 500
  trainer.batch_size: 64
  trainer.patience: 150
  trainer.riemannian: true
  trainer.norm_control.soft_strength: 0.0          # Z = 1 by the constraint
  born.init_kwargs.trim_bonds: true
budgets: [0.05]
analysis:
  purify_delta: [0.05]
  adaptive: {enabled: false}
