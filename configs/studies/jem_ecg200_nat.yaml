# JEM baseline on ecg200, NAT, the default beta ladder, cold (D35, D139): a copy of
# jem_mnist12_nat sized to ecg200_nat's rank (D70, D143), on the series' budgets.
# ecg200's pilot has no JEM: its curves are read before jem_ecg200_at is written.
dataset: ecg200
model: jem
regime: nat
grid:
  embedding: [raw]
  arch: [d3r10]
config:
  trainer.max_epoch: 500
  trainer.batch_size: 64
  trainer.patience: 150
hpo:                           # five hparams: 30 trials, each on 5 folds (D148)
  trials_per_param: 6          # D155: 15 (D81) costs ~10 h per study under CV
  space:
    trainer.optimizer.kwargs.lr: {log: [1e-5, 2e-3]}
    jem.energy_l2: {log: [1e-6, 1e-3]}
    jem.sampler.step_size: {log: [1e-3, 3e-1]}
    jem.sampler.noise_std: {log: [1e-3, 3e-2]}
    jem.sampler.num_steps: {choice: [20, 40]}
budgets: [0.01, 0.02, 0.05, 0.1]   # D145
analysis:
  sweep_purify:                # D132, as mnist12: one SGLD sweep, no ball; adaptive on one seed per beta
    enabled: true
    step: null
    sweeps: [1]
    adaptive_seeds: [1]
