# tests/e2e/test_stages.py: hpo -> select -> train on tiny spirals, two cells.
dataset: spirals
regime: nat
seeds: [7]
grid:
  arch: [d4r3]
  beta: [0, 1]
config:
  dataset.gen_dow_kwargs.size: 200
  trainer.max_epoch: 3
  trainer.batch_size: 64
  tracking.mode: disabled
hpo:
  trials_per_param: 3          # one hparam: 3 trials
  space:
    trainer.optimizer.kwargs.lr: {log: [1e-3, 1e-1]}
budgets: [0.1]
analysis:
  attack_steps: 2
  purify_steps: 2
  percentiles: [10]
  sweep_purify: {enabled: true, sweeps: [1], subsample: 10, gibbs: {num_bins: 4}}
