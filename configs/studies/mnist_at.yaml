# MNIST 28x28, PGD-AT (D43, D46), warm from mnist_nat's beta=0 runs.
dataset: mnist
regime: at
init: warm
grid:
  arch: ???                    # the rank mnist_capacity selects (D44)
  beta: [0, 0.1, 0.5]           # D86, revisit after the β pilots
config:
  trainer.max_epoch: 100
  trainer.batch_size: 512
  trainer.patience: 10
  trainer.norm_control.soft_strength: 1e-3
  trainer.norm_control.log_target: null
hpo:                           # the lr only; clean_weight stays 0 (D80)
  space:
    trainer.optimizer.kwargs.lr: {log: [1e-5, 1e-2]}   # warm start: below the cold default range (D81)
archs:                         # memory only, same optimizer steps (D79); analysis chunks follow
  d3r40: {trainer.micro_batch_size: 256}    # ≈ 5 GB per chunk: fits an 11 GB 1080 Ti
  d3r80: {trainer.micro_batch_size: 128}    # ≈ 10 GB per chunk: tight on a 1080 Ti, safe on an RTX 6000
