# MNIST 28x28, PGD-AT (D43, D46), warm from mnist_nat's beta=0 runs.
dataset: mnist
regime: at
init: warm
grid:
  arch: ???                    # the rank mnist_capacity selects (D44)
  beta: [0, 0.25, 0.5]          # D113: plain AT, β* of E2a under adaptive attack, the last β before the accuracy knee
config:
  trainer.max_epoch: 150       # D88: full radius from epoch 105
  trainer.batch_size: 512
  trainer.patience: 8          # validations (eval_every 5): 40 epochs (D88)
  trainer.norm_control.soft_strength: 1e-3
  trainer.norm_control.log_target: null
hpo:                           # the lr only (D80)
  space:
    trainer.optimizer.kwargs.lr: {log: [1e-5, 1e-2]}   # warm start: below the cold default range (D81)
analysis:
  batch_size: 128              # D111; no micro-batches since D115 (whole batches of 512 up to d3r80)
