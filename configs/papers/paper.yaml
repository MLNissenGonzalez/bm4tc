# The journal paper's figures and tables (D28, D75): `python -m bm4tc figures paper`.
# Kinds and fields: bm4tc/pipeline/figures/. A first draft mirroring the TPM paper
# and the NeurIPS rebuttal; edit freely as the paper takes shape.
#
# Main text: full-resolution MNIST (mnist_*; arch from mnist_capacity, D44), so no
# arch filter is needed there. JEM on full MNIST needs studies jem_mnist_{nat,at}
# (not written yet; jem_mnist12_* exist). Appendix: spirals, MNIST 12x12, (TS: D6).
# The beta values are cells of the ladder {0, 0.01, 0.1, 0.25, 0.5, 0.9, 1} (D108) and
# the AT grid {0, 0.25, 0.5} (D113). Active defences (purification, the detector) are
# reported under the adaptive attack (`_adapt` keys, D114: on seed 1 only on full MNIST,
# D129); their transfer numbers (PGD on the classifier, then the defence) appear only as
# diagnostics, marked "transfer".
out: figures/journal

items:
  # ── Main: the boundary across datasets ───────────────────────────────────
  boundary:               # where the generative term helps the boundary and where AT does;
                          # radii: AT's training radius and twice it (Chlorine: 2.5x, the
                          # nearest budget)
    kind: curve
    x: beta
    ylabel: Accuracy
    ylim: [0, 1.02]
    eps_labels: ["robust, at the AT radius", "robust, at twice the AT radius"]
    panels:
      - {title: Spirals, data: spirals, eps: [0.1, 0.2]}
      - {title: "MNIST $12\\times12$", data: mnist12, where: {arch: d3r40}, eps: [0.1, 0.2]}
      - {title: "MNIST $28\\times28$", data: mnist, eps: [0.1, 0.2]}
      - {title: ECG200, data: ecg200, eps: [0.05, 0.1]}
      - {title: ItalyPowerDemand, data: italypowerdemand, eps: [0.05, 0.1]}
      - {title: Chlorine, data: chlorineconcentration, eps: [0.002, 0.005],
         shade: {from: 0.9, to: 1, label: "majority class"}}
    series:
      - {study: "{data}_nat", key: "rob/test/{eps}", label: NAT, color: C0}
      - {study: "{data}_at", key: "rob/test/{eps}", label: AT, color: C3, style: "--"}
      - {study: "{data}_nat", key: acc/test, label: "clean, NAT", color: C0, thin: true}
      - {study: "{data}_at", key: acc/test, label: "clean, AT", color: C3, style: "--", thin: true}

  # ── Main: the active defences across datasets ────────────────────────────
  defenses:               # boundary's frame and radii; adaptive attack (D114), NAT studies;
                          # full MNIST's adaptive numbers are seed 1 only (D129): no band
    kind: curve
    x: beta
    ylabel: Accuracy
    ylim: [0, 1.02]
    eps_labels: ["at the AT radius", "at twice the AT radius"]
    panels:
      - {title: Spirals, data: spirals, delta: 0.1, eps: [0.1, 0.2]}
      - {title: "MNIST $12\\times12$", data: mnist12, delta: 0.1, where: {arch: d3r40}, eps: [0.1, 0.2]}
      - {title: "MNIST $28\\times28$, seed 1", data: mnist, delta: 0.1, eps: [0.1, 0.2]}
      - {title: ECG200, data: ecg200, delta: 0.1, eps: [0.05, 0.1]}
      - {title: ItalyPowerDemand, data: italypowerdemand, delta: 0.1, eps: [0.05, 0.1]}
      - {title: "Chlorine, $\\delta=0.01$", data: chlorineconcentration, delta: 0.01,
         eps: [0.002, 0.005], shade: {from: 0.9, to: 1, label: "majority class"}}
    series:
      - {study: "{data}_nat", key: "rob/test/{eps}", label: "no defence", color: "0.35"}
      - {study: "{data}_nat", key: "purify_adapt/test/{eps}/d{delta}", label: "purified", color: C2}
      - {study: "{data}_nat", key: "rob_sel_adapt/test/{eps}/q5", label: "detector (selective)", color: C4}
      - {study: "{data}_nat", key: acc/test, label: clean, color: "0.35", thin: true}

  # ── Main: the JEM baseline (MPS solid, JEM dashed) ───────────────────────
  # 2x2 without Chlorine (its high beta is a majority-class classifier); each panel
  # on its own y scale; JEM beta = 1 left out (D176). Radii as boundary; the defences
  # at the radius where each regime's defences separate (NAT: AT's radius, AT: twice it).
  jem_nat:
    kind: curve
    x: beta
    ylabel: Accuracy
    sharey: false
    ncols: 2
    eps_labels: ["at the AT radius", "at twice the AT radius"]
    panels: &jem_panels
      - {title: "MNIST $12\\times12$", data: mnist12, where: {arch: d3r40}, eps: [0.1, 0.2]}
      - {title: "MNIST $28\\times28$", data: mnist, eps: [0.1, 0.2]}
      - {title: ECG200, data: ecg200, eps: [0.05, 0.1]}
      - {title: ItalyPowerDemand, data: italypowerdemand, eps: [0.05, 0.1]}
    series:
      - {study: "{data}_nat", key: "rob/test/{eps}", label: MPS NAT, color: C0}
      - {study: "jem_{data}_nat", where: &jem_no_b1 {beta: [0, 0.01, 0.1, 0.25, 0.5, 0.9]},
         key: "rob/test/{eps}", label: JEM NAT, color: C1, style: "--"}
      - {study: "{data}_nat", key: acc/test, label: "clean, MPS", color: C0, thin: true}
      - {study: "jem_{data}_nat", where: *jem_no_b1, key: acc/test, label: "clean, JEM", color: C1,
         style: "--", thin: true}

  jem_at:
    kind: curve
    x: beta
    ylabel: Accuracy
    sharey: false
    ncols: 2
    eps_labels: ["at the AT radius", "at twice the AT radius"]
    panels: *jem_panels
    series:
      - {study: "{data}_at", key: "rob/test/{eps}", label: MPS AT, color: C3}
      - {study: "jem_{data}_at", key: "rob/test/{eps}", label: JEM AT, color: C5, style: "--"}
      - {study: "{data}_at", key: acc/test, label: "clean, MPS", color: C3, thin: true}
      - {study: "jem_{data}_at", key: acc/test, label: "clean, JEM", color: C5, style: "--", thin: true}

  jem_nat_defenses:       # adaptive attack, at AT's radius
    kind: curve
    x: beta
    ylabel: Accuracy
    sharey: false
    ncols: 2
    legend_cols: 4
    panels:
      - {title: "MNIST $12\\times12$", data: mnist12, where: {arch: d3r40}, eps: [0.1]}
      - {title: "MNIST $28\\times28$", data: mnist, eps: [0.1]}
      - {title: ECG200, data: ecg200, eps: [0.05]}
      - {title: ItalyPowerDemand, data: italypowerdemand, eps: [0.05]}
    series:
      - {study: "{data}_nat", key: "purify_adapt/test/{eps}/d0.1", label: "MPS purified", color: C2}
      - {study: "{data}_nat", key: "rob_sel_adapt/test/{eps}/q5", label: "MPS detector", color: C4}
      - {study: "jem_{data}_nat", where: *jem_no_b1, key: "purify_adapt/test/{eps}/d0.1",
         label: "JEM purified", color: C2, style: "--"}
      - {study: "jem_{data}_nat", where: *jem_no_b1, key: "rob_sel_adapt/test/{eps}/q5",
         label: "JEM detector", color: C4, style: "--"}
      - {study: "{data}_nat", key: "rob/test/{eps}", label: "MPS no defence", color: "0.35", thin: true}
      - {study: "jem_{data}_nat", where: *jem_no_b1, key: "rob/test/{eps}", label: "JEM no defence",
         color: "0.35", style: "--", thin: true}

  jem_at_defenses:        # adaptive attack, at twice AT's radius
    kind: curve
    x: beta
    ylabel: Accuracy
    sharey: false
    ncols: 2
    legend_cols: 4
    panels:
      - {title: "MNIST $12\\times12$", data: mnist12, where: {arch: d3r40}, eps: [0.2]}
      - {title: "MNIST $28\\times28$", data: mnist, eps: [0.2]}
      - {title: ECG200, data: ecg200, eps: [0.1]}
      - {title: ItalyPowerDemand, data: italypowerdemand, eps: [0.1]}
    series:
      - {study: "{data}_at", key: "purify_adapt/test/{eps}/d0.1", label: "MPS purified", color: C2}
      - {study: "{data}_at", key: "rob_sel_adapt/test/{eps}/q5", label: "MPS detector", color: C4}
      - {study: "jem_{data}_at", key: "purify_adapt/test/{eps}/d0.1", label: "JEM purified",
         color: C2, style: "--"}
      - {study: "jem_{data}_at", key: "rob_sel_adapt/test/{eps}/q5", label: "JEM detector",
         color: C4, style: "--"}
      - {study: "{data}_at", key: "rob/test/{eps}", label: "MPS no defence", color: "0.35", thin: true}
      - {study: "jem_{data}_at", key: "rob/test/{eps}", label: "JEM no defence", color: "0.35",
         style: "--", thin: true}

  # ── Main: capacity (single panels, combined in the paper) ────────────────
  # MNIST 12x12 over beta, one colour per bond dimension r (mnist12_nat); then the
  # physical dimension d at r = 40 (mnist12_pdim, d = 3 from mnist12_nat).
  mnist12_rank_acc:
    kind: curve
    x: beta
    ylabel: Accuracy
    ylim: [0, 1.02]
    legend_cols: 3
    panels: [{title: "MNIST $12\\times12$", eps: [0.1]}]
    series:
      - {study: mnist12_nat, where: {arch: d3r10}, key: "rob/test/{eps}", label: "robust, $r=10$", color: C0}
      - {study: mnist12_nat, where: {arch: d3r20}, key: "rob/test/{eps}", label: "robust, $r=20$", color: C1}
      - {study: mnist12_nat, where: {arch: d3r40}, key: "rob/test/{eps}", label: "robust, $r=40$", color: C2}
      - {study: mnist12_nat, where: {arch: d3r10}, key: acc/test, label: "clean, $r=10$", color: C0, thin: true}
      - {study: mnist12_nat, where: {arch: d3r20}, key: acc/test, label: "clean, $r=20$", color: C1, thin: true}
      - {study: mnist12_nat, where: {arch: d3r40}, key: acc/test, label: "clean, $r=40$", color: C2, thin: true}

  mnist12_rank_nll:
    kind: curve
    x: beta
    ylabel: "$-\\log p(x)$ per feature"
    legend_cols: 3
    panels: [{title: "MNIST $12\\times12$"}]
    series:
      - {study: mnist12_nat, where: {arch: d3r10}, key: loss_x/test, label: "$r=10$", color: C0}
      - {study: mnist12_nat, where: {arch: d3r20}, key: loss_x/test, label: "$r=20$", color: C1}
      - {study: mnist12_nat, where: {arch: d3r40}, key: loss_x/test, label: "$r=40$", color: C2}

  mnist12_rank_defenses:  # adaptive attack (D114)
    kind: curve
    x: beta
    ylabel: Accuracy
    ylim: [0, 1.02]
    legend_cols: 3
    panels: [{title: "MNIST $12\\times12$", eps: [0.1]}]
    series:
      - {study: mnist12_nat, where: {arch: d3r10}, key: "purify_adapt/test/{eps}/d0.1", label: "purified, $r=10$", color: C0}
      - {study: mnist12_nat, where: {arch: d3r20}, key: "purify_adapt/test/{eps}/d0.1", label: "purified, $r=20$", color: C1}
      - {study: mnist12_nat, where: {arch: d3r40}, key: "purify_adapt/test/{eps}/d0.1", label: "purified, $r=40$", color: C2}
      - {study: mnist12_nat, where: {arch: d3r10}, key: "rob_sel_adapt/test/{eps}/q5", label: "detector, $r=10$", color: C0, style: "--"}
      - {study: mnist12_nat, where: {arch: d3r20}, key: "rob_sel_adapt/test/{eps}/q5", label: "detector, $r=20$", color: C1, style: "--"}
      - {study: mnist12_nat, where: {arch: d3r40}, key: "rob_sel_adapt/test/{eps}/q5", label: "detector, $r=40$", color: C2, style: "--"}

  mnist12_pdim_acc:
    kind: curve
    x: phys_dim
    ylabel: Accuracy
    ylim: [0, 1.02]
    legend_cols: 3
    where: &pdim_r40 {arch: [d2r40, d3r40, d5r40, d10r40]}
    eps_labels: ["robust, $\\varepsilon=0.05$", "robust, $\\varepsilon=0.1$"]
    panels: [{title: "MNIST $12\\times12$, $r=40$", eps: [0.05, 0.1]}]
    series:
      - {study: [mnist12_pdim, mnist12_nat], where: {beta: 0}, key: "rob/test/{eps}", label: "$\\beta=0$", color: C0}
      - {study: [mnist12_pdim, mnist12_nat], where: {beta: 1}, key: "rob/test/{eps}", label: "$\\beta=1$", color: C3}
      - {study: [mnist12_pdim, mnist12_nat], where: {beta: 0}, key: acc/test, label: "clean, $\\beta=0$", color: C0, thin: true}
      - {study: [mnist12_pdim, mnist12_nat], where: {beta: 1}, key: acc/test, label: "clean, $\\beta=1$", color: C3, thin: true}

  mnist12_pdim_nll:       # rank 1 = the pixel marginals (mnist12_pdim_rank1)
    kind: curve
    x: phys_dim
    ylabel: "$-\\log p(x)$ per feature"
    legend_cols: 3
    panels: [{title: "MNIST $12\\times12$"}]
    series:
      - {study: [mnist12_pdim, mnist12_nat], where: {<<: *pdim_r40, beta: 0}, key: loss_x/test, label: "$r=40$, $\\beta=0$", color: C0}
      - {study: [mnist12_pdim, mnist12_nat], where: {<<: *pdim_r40, beta: 1}, key: loss_x/test, label: "$r=40$, $\\beta=1$", color: C3}
      - {study: mnist12_pdim_rank1, key: loss_x/test, label: "$r=1$ (marginals), $\\beta=1$", color: "0.4", style: ":"}

  # ── Main: MNIST ───────────────────────────────────────────────────────────
  mnist_beta_acc:
    kind: curve
    x: beta
    eps: 0.1
    ylabel: Accuracy
    ylim: [0, 1.02]
    series:
      - {study: mnist_nat, key: acc/test, label: Clean}
      - {study: mnist_nat, key: "rob/test/{eps}", label: Robust}
      - {study: mnist_nat, key: "purify_adapt/test/{eps}/d0.1", label: "Purified ($\\delta=0.1$)"}
      - {study: mnist_nat, key: "rob_sel_adapt/test/{eps}/q5", label: "Detector ($q=5$, selective)"}
      - {study: mnist_nat, key: "purify/test/{eps}/d0.1", label: "Purified (transfer)", style: "--"}

  mnist_beta_nll:
    kind: curve
    x: beta
    ylabel: "$-\\log p(c|x)$"
    ylabel_right: "$-\\log p(x, c)$"
    series:
      - {study: mnist_nat, key: loss_dis/test, label: Discriminative NLL}
      - {study: mnist_nat, key: loss_x/test, label: NLL per feature, axis: right}

  mnist_headline:
    kind: table
    eps: 0.1
    models: &mnist_models
      - {study: mnist_nat, where: {beta: 0}, label: "MPS $\\beta=0$"}
      - {study: mnist_nat, where: {beta: 0.25}, label: "MPS $\\beta=0.25$"}
      - {study: mnist_nat, where: {beta: 0.9}, label: "MPS $\\beta=0.9$"}
      - {study: mnist_nat, where: {beta: 1}, label: "MPS $\\beta=1$"}
      - {study: mnist_at, where: {beta: 0}, label: "MPS AT"}
      - {study: mnist_at, where: {beta: 0.5}, label: "MPS AT $\\beta=0.5$"}
      - {study: jem_mnist_nat, where: {beta: 0}, label: "JEM $\\beta=0$"}
      - {study: jem_mnist_nat, where: {beta: 0.9}, label: "JEM $\\beta=0.9$"}
      - {study: jem_mnist_at, where: {beta: 0}, label: "JEM AT"}
      - {study: jem_mnist_at, where: {beta: 0.5}, label: "JEM AT $\\beta=0.5$"}
    metrics: &headline_metrics
      - {key: acc/test, label: Clean, best: max}
      - {key: "rob/test/{eps}", label: Robust, best: max}
      - {key: "purify_adapt/test/{eps}/d0.1", label: Purified, best: max}
      - {key: "purify_adapt/test/{eps}/d0.1", minus: "rob/test/{eps}", label: Gain, best: max}
      - {key: "rob_sel_adapt/test/{eps}/q5", label: "Detector", best: max}

  mnist_defenses:
    kind: bars
    eps: [0.1, 0.2]
    models:
      - {study: mnist_nat, where: {beta: 0}, label: "MPS $\\beta=0$"}
      - {study: mnist_nat, where: {beta: 0.9}, label: "MPS $\\beta=0.9$"}
      - {study: mnist_at, where: {beta: 0.5}, label: "MPS AT $\\beta=0.5$"}
      - {study: jem_mnist_nat, where: {beta: 0.9}, label: "JEM $\\beta=0.9$"}
      - {study: jem_mnist_at, where: {beta: 0}, label: "JEM AT"}
    metrics:
      - {key: acc/test, label: Clean}
      - {key: "rob/test/{eps}", label: Robust}
      - {key: "purify_adapt/test/{eps}/d0.1", label: Purified}
      - {key: "rob_sel_adapt/test/{eps}/q5", label: "Detector ($q=5$)"}
      - {key: "purify/test/{eps}/d0.1", label: "Purified (transfer)"}

  mnist_capacity:
    kind: curve
    x: bond_dim
    ylabel: Clean accuracy
    ylabel_right: "$-\\log p(x, c)$"
    series:
      - {study: mnist_capacity, where: {beta: 0}, key: acc/test, label: "acc, $\\beta=0$"}
      - {study: mnist_capacity, where: {beta: 1}, key: acc/test, label: "acc, $\\beta=1$"}
      - {study: mnist_capacity, where: {beta: 1}, key: loss_x/test, label: "NLL per feature, $\\beta=1$",
         axis: right, style: ":"}

  mnist_coverage:
    kind: coverage
    eps: 0.1
    models:
      - {study: mnist_nat, where: {beta: 0}, label: "MPS $\\beta=0$"}
      - {study: mnist_nat, where: {beta: 0.9}, label: "MPS $\\beta=0.9$"}
      - {study: mnist_at, where: {beta: 0.5}, label: "MPS AT $\\beta=0.5$"}
      - {study: jem_mnist_nat, where: {beta: 0.9}, label: "JEM $\\beta=0.9$"}

  mnist_detection:        # transfer: fraction of PGD examples flagged at the clean q-th percentile (D2);
                          # then selective robust accuracy at q5, transfer and adaptive (D114)
    kind: table
    eps: 0.1
    models: *mnist_models
    metrics:
      - {key: "detect/test/0/q5", label: "FPR ($q=5$)"}
      - {key: "detect/test/{eps}/q1", label: "$q=1$", best: max}
      - {key: "detect/test/{eps}/q5", label: "$q=5$", best: max}
      - {key: "detect/test/{eps}/q10", label: "$q=10$", best: max}
      - {key: "detect/test/{eps}/q20", label: "$q=20$", best: max}
      - {key: "rob_sel/test/{eps}/q5", label: "selective, $q=5$ (transfer)", best: max}
      - {key: "rob_sel_adapt/test/{eps}/q5", label: "selective, $q=5$", best: max}

  mnist_purify_vs_eps:
    kind: curve
    x: eps
    ylabel: Accuracy
    ylim: [0, 1.02]
    series:
      - {study: mnist_nat, where: {beta: 0}, key: "purify_adapt/test/{x}/d0.1", label: "purified, $\\beta=0$"}
      - {study: mnist_nat, where: {beta: 0.9}, key: "purify_adapt/test/{x}/d0.1", label: "purified, $\\beta=0.9$"}
      - {study: mnist_at, where: {beta: 0.5}, key: "purify_adapt/test/{x}/d0.1", label: "purified, AT"}
      - {study: mnist_nat, where: {beta: 0}, key: "rob/test/{x}", label: "robust, $\\beta=0$", style: "--", color: C0}
      - {study: mnist_nat, where: {beta: 0.9}, key: "rob/test/{x}", label: "robust, $\\beta=0.9$", style: "--", color: C1}
      - {study: mnist_at, where: {beta: 0.5}, key: "rob/test/{x}", label: "robust, AT", style: "--", color: C2}

  mnist_gibbs:            # Gibbs: one sweep, no window; transfer only on full MNIST (D132)
    kind: table
    eps: [0.1, 0.2]
    models: &mnist_mps_models
      - {study: mnist_nat, where: {beta: 0}, label: "MPS $\\beta=0$"}
      - {study: mnist_nat, where: {beta: 0.25}, label: "MPS $\\beta=0.25$"}
      - {study: mnist_nat, where: {beta: 0.9}, label: "MPS $\\beta=0.9$"}
      - {study: mnist_nat, where: {beta: 1}, label: "MPS $\\beta=1$"}
      - {study: mnist_at, where: {beta: 0}, label: "MPS AT"}
      - {study: mnist_at, where: {beta: 0.5}, label: "MPS AT $\\beta=0.5$"}
    metrics:
      - {key: "purify_gibbs/test/0/k1", label: "Clean, Gibbs"}
      - {key: "purify_gibbs/test/{eps}/k1", label: "Gibbs (transfer)", best: max}
      - {key: "purify_gibbs/test/{eps}/k1", minus: "rob/test/{eps}", label: "Gain (transfer)"}

  mnist_sgld:             # JEM's counterpart: one SGLD sweep, no ball; transfer only (D132)
    kind: table
    eps: [0.1, 0.2]
    models:
      - {study: jem_mnist_nat, where: {beta: 0}, label: "JEM $\\beta=0$"}
      - {study: jem_mnist_nat, where: {beta: 0.9}, label: "JEM $\\beta=0.9$"}
      - {study: jem_mnist_at, where: {beta: 0}, label: "JEM AT"}
      - {study: jem_mnist_at, where: {beta: 0.5}, label: "JEM AT $\\beta=0.5$"}
    metrics:
      - {key: "purify_sgld/test/0/k1", label: "Clean, SGLD"}
      - {key: "purify_sgld/test/{eps}/k1", label: "SGLD (transfer)", best: max}

  mnist_samples:
    kind: samples
    models:
      - {study: mnist_nat, where: {beta: 0}, label: "$\\beta=0$"}
      - {study: mnist_nat, where: {beta: 0.9}, label: "$\\beta=0.9$"}
      - {study: mnist_nat, where: {beta: 0.25}, label: "$\\beta=0.25$"}
      - {study: mnist_nat, where: {beta: 1}, label: "$\\beta=1$"}
      - {study: jem_mnist_nat, where: {beta: 0.9}, label: "JEM $\\beta=0.9$"}

  mnist_transfer:
    kind: transfer
    eps: 0.1
    delta: 0.1
    models:
      - {study: mnist_at, where: {beta: 0.5}, label: "MPS AT", source: true}
      - {study: mnist_nat, where: {beta: 0}, label: "MPS $\\beta=0$"}
      - {study: mnist_nat, where: {beta: 0.9}, label: "MPS $\\beta=0.9$"}
      - {study: jem_mnist_nat, where: {beta: 0.9}, label: "JEM $\\beta=0.9$"}

  # ── Appendix: spirals ─────────────────────────────────────────────────────
  spirals_density:
    kind: density
    models:
      - {study: spirals_at, where: {beta: 0}, label: AT}
      - {study: spirals_nat, where: {beta: 0}, label: "$\\beta=0$"}
      - {study: spirals_nat, where: {beta: 0.5}, label: "$\\beta=0.5$"}
      - {study: spirals_nat, where: {beta: 1}, label: "$\\beta=1$"}

  spirals_beta_acc:
    kind: curve
    x: beta
    eps: 0.2
    ylabel: Accuracy
    ylim: [0, 1.02]
    series:
      - {study: spirals_nat, key: acc/test, label: Clean}
      - {study: spirals_nat, key: "rob/test/{eps}", label: Robust}
      - {study: spirals_nat, key: "rob_ceiling/test/{eps}", label: "Robust ceiling", style: ":"}
      - {study: spirals_nat, key: "purify_adapt/test/{eps}/d0.1", label: "Purified ($\\delta=0.1$)"}
      - {study: spirals_nat, key: "rob_sel_adapt/test/{eps}/q5", label: "Detector ($q=5$, selective)"}
      - {study: spirals_nat, key: "rob_ceiling_sel/test/{eps}", label: "Selective ceiling", style: ":"}
      - {study: spirals_nat, key: "purify/test/{eps}/d0.1", label: "Purified (transfer)", style: "--"}

  spirals_beta_nll:
    kind: curve
    x: beta
    ylabel: "$-\\log p(c|x)$"
    ylabel_right: "$-\\log p(x, c)$"
    series:
      - {study: spirals_nat, key: loss_dis/test, label: Discriminative NLL}
      - {study: spirals_nat, key: loss_x/test, label: NLL per feature, axis: right}

  spirals_defenses:
    kind: bars
    eps: [0.05, 0.1, 0.2]       # D122's budgets
    models: &spirals_models
      - {study: spirals_nat, where: {beta: 0}, label: "$\\beta=0$"}
      - {study: spirals_nat, where: {beta: 0.5}, label: "$\\beta=0.5$"}
      - {study: spirals_nat, where: {beta: 1}, label: "$\\beta=1$"}
      - {study: spirals_at, where: {beta: 0}, label: AT}
      - {study: spirals_at, where: {beta: 0.25}, label: "AT $\\beta=0.25$"}
    metrics:
      - {key: acc/test, label: Clean}
      - {key: "rob/test/{eps}", label: Robust}
      - {key: "purify_adapt/test/{eps}/d0.1", label: Purified}
      - {key: "rob_sel_adapt/test/{eps}/q5", label: "Detector ($q=5$)"}
      - {key: "rob_ceiling/test/{eps}", label: Ceiling}

  spirals_summary:
    kind: table
    eps: [0.05, 0.1, 0.2]
    models: *spirals_models
    metrics: *headline_metrics

  spirals_capacity:
    kind: curve
    x: bond_dim
    eps: 0.2
    ylabel: Accuracy
    series:
      - {study: spirals_capacity, where: {beta: 0}, key: acc/test, label: "clean, $\\beta=0$"}
      - {study: spirals_capacity, where: {beta: 1}, key: acc/test, label: "clean, $\\beta=1$"}
      - {study: spirals_capacity, where: {beta: 0}, key: "rob/test/{eps}", label: "robust, $\\beta=0$", style: "--"}
      - {study: spirals_capacity, where: {beta: 1}, key: "rob/test/{eps}", label: "robust, $\\beta=1$", style: "--"}

  spirals_capacity_density:
    kind: density
    where: {beta: 1}
    models:
      - {study: spirals_capacity, where: {arch: d4r3}, label: "$d=4, r=3$"}
      - {study: spirals_capacity, where: {arch: d6r4}, label: "$d=6, r=4$"}
      - {study: spirals_capacity, where: {arch: d10r6}, label: "$d=10, r=6$"}
      - {study: spirals_capacity, where: {arch: d30r18}, label: "$d=30, r=18$"}

  spirals_capacity_check:   # D42: the d10r6 cells, tuned twice, should agree
    kind: table
    eps: 0.2
    models:
      - {study: spirals_nat, where: {beta: 0}, label: "spirals\\_nat $\\beta=0$"}
      - {study: spirals_capacity, where: {arch: d10r6, beta: 0}, label: "spirals\\_capacity $\\beta=0$"}
      - {study: spirals_nat, where: {beta: 1}, label: "spirals\\_nat $\\beta=1$"}
      - {study: spirals_capacity, where: {arch: d10r6, beta: 1}, label: "spirals\\_capacity $\\beta=1$"}
    metrics:
      - {key: acc/test, label: Clean}
      - {key: loss_x/test, label: "NLL/feature"}
      - {key: "rob/test/{eps}", label: Robust}
      - {key: objective/valid, label: "Objective (valid)"}

  spirals_embedding_density:
    kind: density
    where: {beta: 1}
    models:
      - {study: spirals_embedding, where: {embedding: legendre}, label: Legendre}
      - {study: spirals_embedding, where: {embedding: fourier}, label: Fourier}
      - {study: spirals_embedding, where: {embedding: hermite}, label: Hermite}
      - {study: spirals_embedding, where: {embedding: chebychev1}, label: "Chebyshev I"}
      - {study: spirals_embedding, where: {embedding: chebychev2}, label: "Chebyshev II"}

  spirals_embedding:
    kind: table
    eps: 0.2
    models:
      - {study: spirals_embedding, where: {embedding: legendre, beta: 1}, label: Legendre}
      - {study: spirals_embedding, where: {embedding: fourier, beta: 1}, label: Fourier}
      - {study: spirals_embedding, where: {embedding: hermite, beta: 1}, label: Hermite}
      - {study: spirals_embedding, where: {embedding: chebychev1, beta: 1}, label: "Chebyshev I"}
      - {study: spirals_embedding, where: {embedding: chebychev2, beta: 1}, label: "Chebyshev II"}
    metrics:
      - {key: acc/test, label: Clean, best: max}
      - {key: loss_x/test, label: "NLL/feature", best: min}
      - {key: "rob/test/{eps}", label: Robust, best: max}
      - {key: "purify_adapt/test/{eps}/d0.1", label: Purified, best: max}

  # ── Appendix: MNIST 12x12 (the rebuttal's setting) ─────────────────────────
  mnist12_beta_acc:
    kind: curve
    x: beta
    eps: 0.1
    where: {arch: d3r40}
    ylabel: Accuracy
    ylim: [0, 1.02]
    series:
      - {study: mnist12_nat, key: acc/test, label: Clean}
      - {study: mnist12_nat, key: "rob/test/{eps}", label: Robust}
      - {study: mnist12_nat, key: "purify_adapt/test/{eps}/d0.1", label: "Purified ($\\delta=0.1$)"}
      - {study: mnist12_nat, key: "rob_sel_adapt/test/{eps}/q5", label: "Detector ($q=5$, selective)"}
      - {study: jem_mnist12_nat, key: acc/test, label: "JEM clean", style: "--"}
      - {study: jem_mnist12_nat, key: "purify_adapt/test/{eps}/d0.1", label: "JEM purified", style: "--"}

  mnist12_capacity:
    kind: curve
    x: bond_dim
    ylabel: Clean accuracy
    series:
      - {study: mnist12_nat, where: {beta: 0}, key: acc/test, label: "$\\beta=0$"}
      - {study: mnist12_nat, where: {beta: 0.5}, key: acc/test, label: "$\\beta=0.5$"}
      - {study: mnist12_nat, where: {beta: 1}, key: acc/test, label: "$\\beta=1$"}

  mnist12_headline:
    kind: table
    eps: 0.1
    where: {arch: d3r40}
    models:
      - {study: mnist12_nat, where: {beta: 0}, label: "MPS $\\beta=0$"}
      - {study: mnist12_nat, where: {beta: 0.5}, label: "MPS $\\beta=0.5$"}
      - {study: mnist12_nat, where: {beta: 0.9}, label: "MPS $\\beta=0.9$"}
      - {study: mnist12_nat, where: {beta: 1}, label: "MPS $\\beta=1$"}
      - {study: mnist12_at, where: {beta: 0.5}, label: "MPS AT $\\beta=0.5$"}
      - {study: jem_mnist12_nat, where: {beta: 0}, label: "JEM $\\beta=0$"}
      - {study: jem_mnist12_nat, where: {beta: 0.5}, label: "JEM $\\beta=0.5$"}
      - {study: jem_mnist12_at, where: {beta: 0}, label: "JEM AT"}
    metrics: *headline_metrics

  mnist12_gibbs:          # Gibbs: one sweep, no window; adaptive on seed 1 per beta (D132)
    kind: table
    eps: [0.1, 0.2]
    where: {arch: d3r40}
    models:
      - {study: mnist12_nat, where: {beta: 0}, label: "MPS $\\beta=0$"}
      - {study: mnist12_nat, where: {beta: 0.25}, label: "MPS $\\beta=0.25$"}
      - {study: mnist12_nat, where: {beta: 0.9}, label: "MPS $\\beta=0.9$"}
      - {study: mnist12_nat, where: {beta: 1}, label: "MPS $\\beta=1$"}
      - {study: mnist12_at, where: {beta: 0.25}, label: "MPS AT $\\beta=0.25$"}
    metrics:
      - {key: "purify_gibbs/test/0/k1", label: "Clean, Gibbs"}
      - {key: "purify_gibbs_adapt/test/{eps}/k1", label: "Gibbs", best: max}
      - {key: "purify_gibbs/test/{eps}/k1", label: "Gibbs (transfer)"}

  spirals_gibbs:          # windowed Gibbs, adaptive on seed 1 per beta (D132)
    kind: table
    eps: [0.05, 0.1, 0.2]
    models: *spirals_models
    metrics:
      - {key: "purify_gibbs_adapt/test/{eps}/k1", label: "Gibbs, 1 sweep", best: max}
      - {key: "purify_gibbs_adapt/test/{eps}/k6", label: "Gibbs, 6 sweeps", best: max}
      - {key: "purify_gibbs/test/{eps}/k6", label: "6 sweeps (transfer)"}
      - {key: "rob_ceiling/test/{eps}", label: Ceiling}
