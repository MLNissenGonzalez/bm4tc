experiment: default
descriptor: ""
stage: ""

defaults:
  - base_config  # the schema (experiments/config.py): unknown keys fail (D25)
  - _self_ # has to be here such that overrides work
  - dataset: 2Dtoy/circles
  - born: fourier/test
  - trainer/nat: test
  - trainer/at: null
  - tracking: test
  - override hydra/job_logging: stream_only
  - override hydra/hydra_logging: none

hydra:
  run:
    # For single runs: outputs/{dataset}/{nat|at}/{embedding}/{arch}/[{stage}/]{kind}_{date}/
    dir: ${outputs_root:}/${dataset.name}/${training_regime:}/${born.embedding}/d${born.init_kwargs.in_dim}r${born.init_kwargs.bond_dim}${dtype_suffix:}/${stage_path:}${experiment}_${now:%d%m_%H%M}

  sweep:
    # For multiruns: outputs/{dataset}/{nat|at}/{embedding}/{arch}/[{stage}/]{kind}_{date}/{job}/
    dir: ${outputs_root:}/${dataset.name}/${training_regime:}/${born.embedding}/d${born.init_kwargs.in_dim}r${born.init_kwargs.bond_dim}${dtype_suffix:}/${stage_path:}${experiment}_${now:%d%m}
    subdir: ${hydra.job.num}

  output_subdir: .hydra