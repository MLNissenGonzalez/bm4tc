# AT: the Trainer with a PGD attack (PGD-AT). Loss
#   (1-β)·L_dis(x_adv) + (β/N)·L_gen(x)          (plain PGD-AT, D80, D91)
# Validation attacks every valid sample at the full radius every eval_every epochs; patience counts validations. AT runs are always warm (D19).
evasion:
  method: PGD
  norm: inf
  eps_rel: [0.1]      # training radius (fraction of the input range); a study's grid.eps sets it
  num_steps: 5        # D43, D88: PGD-5 lost 0.5 points of rob/test against PGD-10
  step_size: null     # 2.5 · eps_abs / num_steps
  random_start: true
eval_every: 5
# Ramp the radius from 1% to full by 70% of max_epoch, as every previous AT study did
# (D40, D54).
curriculum: true
curriculum_eps_start_rel: 0.01
curriculum_end: 0.7
save: true
