# PGD Adversarial Training (Madry et al.)
# Loss = (1-a)·[(1-cw)·L_dis(x_adv) + cw·L_dis(x)] + a·L_gen(x)
max_epoch: 100
batch_size: 256

optimizer:
  name: "adam"
  kwargs:
    lr: 1e-4
    weight_decay: 0.0


evasion:
  method: "PGD"
  norm: 2
  criterion:
    name: "negative log-likelihood"
  eps_rel: [0.1]  # fraction of the input domain; abs 0.2 on legendre (width 2.0)
  num_steps: 10
  step_size: null  # defaults to 2.5 * eps_abs / num_steps
  random_start: true

patience: 30

eval_every: 5  # validation (with the attack) every 5 epochs; patience counts these

clean_weight: 0.0  # pure adversarial (set > 0 to mix with clean examples)
curriculum: false
curriculum_eps_start_rel: 0.0
curriculum_end: 1.0  # fraction of max_epoch

# Norm control: hard renormalization off (hard_every=0), soft log_Z penalty on
# (soft_strength=0.1 toward log_target). Set soft_strength=0 to disable, or
# hard_every>0 to hard-pin. log_target: 0.0 | null (pretrained log_Z) | expression str.
norm_control:
  log_target: 0.0
  hard_every: 0
  soft_strength: 0.1
  debug: false

save: true
