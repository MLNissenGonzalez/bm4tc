# PGD Adversarial Training (Madry et al.)
# Trains on adversarial examples: Loss = L(x_adv, y)
max_epoch: 100
batch_size: 256

optimizer:
  name: "adam"
  kwargs:
    lr: 1e-4
    weight_decay: 0.0

criterion:
  name: "negative log-likelihood"

evasion:
  method: "PGD"
  norm: 2
  criterion:
    name: "negative log-likelihood"
  eps_rel: [0.1]  # fraction of the input domain; abs 0.2 on legendre (width 2.0)
  num_steps: 10
  step_size: null  # defaults to 2.5 * eps_abs / num_steps
  random_start: true

# Select on the objective mirrored on valid: (1-cw)*mixed_nll(x_adv) + cw*mixed_nll(x)
# under the default objective, or the split formula under gen_on_clean. Unlike "rob"
# it sees the generative half of the loss at alpha>0. Produced by the attack pass
# only, so it requires eval_rob_freq >= 1; robustness is still evaluated and logged.
stop_crit: "at_loss"
patience: 30

eval_rob_freq: 5

clean_weight: 0.0  # pure adversarial (set > 0 to mix with clean examples)
# true: adversarial signal in the discriminative term only, generative term on
# clean data. Switches validation to eval_split (every eval_rob_freq epochs, none
# in between), so patience is then counted in valid events, not epochs.
gen_on_clean: false
acc_floor: null  # min clean valid-acc for model selection (null = no floor)
curriculum: false
curriculum_eps_start_rel: 0.0
curriculum_end_epoch: null

# Norm control: hard renormalization off (hard_every=0), soft log_Z penalty on
# (soft_strength=0.1 toward log_target). Set soft_strength=0 to disable, or
# hard_every>0 to hard-pin. log_target: 0.0 | null (pretrained log_Z) | expression str.
norm_control:
  log_target: 0.0
  hard_every: 0
  soft_strength: 0.1
  debug: false

save: true
auto_stack: true
auto_unbind: false
