# Test configuration for adversarial training (minimal settings for quick testing)
alpha: 0.0
max_epoch: 10
batch_size: 256

optimizer:
  name: "adam"
  kwargs:
    lr: 1e-4
    weight_decay: 0.0

criterion:
  name: "negative log-likelihood"

evasion:
  method: "PGD"
  norm: "inf"
  criterion:
    name: "negative log-likelihood"
  eps_rel: [0.15]
  num_steps: 5
  step_size: null
  random_start: true

stop_crit: "rob"
patience: 5

eval_rob_freq: 1

clean_weight: 0.0
gen_on_clean: false
acc_floor: null
curriculum: false
curriculum_eps_start_rel: 0.0
curriculum_end_epoch: null

norm_control:
  log_target: 0.0
  hard_every: 0
  soft_strength: 0.1
  debug: false

save: false
auto_stack: true
auto_unbind: false
