max_epoch: 4
batch_size: 256
optimizer:
  name: "adam"
  kwargs:
    lr: 1e-4
    weight_decay: 0.00
criterion:
  name: "nll"
  kwargs:
    eps: 1e-8
patience: 10
stop_crit: "gen_loss"
watch_freq: 0
norm_control:
  target: 1.0
  hard_every: 1
  soft_strength: 0.0
save: false
auto_stack: true
auto_unbind: false
