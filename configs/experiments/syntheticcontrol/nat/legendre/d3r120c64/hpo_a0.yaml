# @package _global_
experiment: hpo_a0

descriptor: nll
defaults:
  - override /born: legendre/d3r120c64
  - override /dataset: ucr_ts/syntheticcontrol
  - override /trainer/adversarial: null
  - override /tracking: online
  - override /hydra/sweeper: optuna

tracking:
  seed: 42

trainer:
  nll:
    alpha: 0.0
    max_epoch: 800
    batch_size: 100
    patience: 300
    stop_crit: "acc"
    save: false
    norm_control:
      hard_every: 0
      soft_strength: 0.0
    optimizer:
      name: "adam"
      kwargs:
        lr: 1e-4
        weight_decay: 0.0

hydra:
  sweeper:
    study_name: "${experiment}_${dataset.name}"
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: 42
      n_startup_trials: 4
    direction: minimize
    n_trials: 8
    params:
      trainer.nll.optimizer.kwargs.lr: tag(log, interval(1e-6, 5e-3))
