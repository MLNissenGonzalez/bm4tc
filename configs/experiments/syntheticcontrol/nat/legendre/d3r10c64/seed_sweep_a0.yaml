# @package _global_
experiment: seed_sweep_a0

defaults:
  - override /born: legendre/d3r10c64
  - override /dataset: ucr_ts/syntheticcontrol
  - override /trainer/adversarial: null
  - override /tracking: online

tracking:
  seed: 42

trainer:
  nll:
    max_epoch: 800
    batch_size: 100
    patience: 300
    stop_crit: "acc"
    save: true
    optimizer:
      name: "adam"
      kwargs:
        lr: 0.0008322724281704736    # FILL FROM HPO
        weight_decay: 1.9185136028649245e-07  # FILL FROM HPO

hydra:
  sweeper:
    params:
      tracking.seed: range(1,11)
