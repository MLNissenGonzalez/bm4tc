# @package _global_
# ---------------------------------------------------------------------------
# General alpha>0 (generative, pretrained) HPO for crickety.
#
# One config covers every bond dimension AND every alpha>0. The alpha is
# passed on the CLI and is folded into the `experiment` token via the
# `alpha_suffix` resolver, so each alpha lands in its own output/analysis
# folder (e.g. alpha=0.5 -> hpo_pretrained_a05). Bond dim is set via `born`
# and tracked in the arch path segment automatically.
#
# Fine-tunes from the best alpha=0 (hpo_a0) checkpoint of the *same* bond dim,
# supplied via `model_path`. Sweeps learning rate and soft_strength.
#
# Usage (alpha and matching model_path are required):
#   python -m experiments.train --multirun \
#       +experiments=crickety/nat/legendre/hpo_pretrained \
#       born=legendre/d3r60c64 \
#       trainer.nll.alpha=0.5 \
#       model_path=outputs/crickety/nat/legendre/d3r60c64/hpo_a0_{DDMM}/0/models/model
#
#   # large r: add a smaller batch size
#   ... born=legendre/d3r100c64 trainer.nll.batch_size=64 ...
#
# Output:  outputs/crickety/nat/legendre/d3r{R}c64/hpo_pretrained_a{X}_{DDMM}/{job}/
# ---------------------------------------------------------------------------
experiment: "hpo_pretrained_${alpha_suffix:}"
descriptor: nll_pretrained

defaults:
  - override /born: legendre/d3r60c64
  - override /dataset: ucr_ts/crickety
  - override /trainer/adversarial: null
  - override /tracking: online
  - override /hydra/sweeper: optuna

# Required on the CLI: best hpo_a0 checkpoint for the chosen bond dim.
model_path: ???

tracking:
  seed: 42

trainer:
  nll:
    alpha: 0.5
    max_epoch: 800
    batch_size: 100
    patience: 200
    stop_crit: "mixed_loss"
    save: false
    norm_control:
      hard_every: 0
      soft_strength: 1.0
      log_target: null
      debug: false
    optimizer:
      name: "adam"
      kwargs:
        lr: 1e-5
        weight_decay: 0.0

hydra:
  sweeper:
    study_name: "${experiment}_${dataset.name}"
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: 42
      n_startup_trials: 5
    direction: minimize
    n_trials: 20
    n_jobs: 1
    params:
      trainer.nll.optimizer.kwargs.lr: tag(log, interval(1e-6, 5e-4))
      trainer.nll.norm_control.soft_strength: tag(log, interval(0.1, 100.0))
