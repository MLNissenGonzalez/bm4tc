# @package _global_
experiment: seed_sweep_a0

defaults:
  - override /born: legendre/d3r10c64
  - override /dataset: ucr_ts/crickety
  - override /trainer/adversarial: null
  - override /tracking: online

tracking:
  seed: 42

trainer:
  nll:
    max_epoch: 800
    batch_size: 100
    patience: 300
    stop_crit: "acc"
    save: true
    optimizer:
      name: "adam"
      kwargs:
        lr: 0.0001982604969812946    # FILL FROM HPO
        weight_decay: 8.773777545836655e-05  # FILL FROM HPO

hydra:
  sweeper:
    params:
      tracking.seed: range(1,11)
