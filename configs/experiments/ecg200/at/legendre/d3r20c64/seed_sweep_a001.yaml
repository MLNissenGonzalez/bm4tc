# @package _global_
# ---------------------------------------------------------------------------
# Per-arch, per-alpha AT seed sweep for ecg200 at legendre/d3r20c64, alpha=0.01.
#
# Seeds 1-5 of adversarial training, fine-tuned from the best clean (alpha=0)
# checkpoint for this bond dim (model_path, supplied on launch). Hyperparameters
# (lr, clean_weight, soft_strength) are left open as `???  # FILL FROM HPO` and
# populated from the matching ecg200/at/legendre/hpo.yaml HPO run via
# tools/fill_hpo.py (HPO launched with born=legendre/d3r20c64 alpha=0.01).
#
# Usage (after filling HPs; model_path on the CLI):
#   python -m experiments.train --multirun \
#       +experiments=ecg200/at/legendre/d3r20c64/seed_sweep_a001 \
#       model_path=outputs/ecg200/nat/legendre/d3r20c64/hpo_a0_{DDMM}/0/models/model
#
# Output:  outputs/ecg200/at/legendre/d3r20c64/seed_sweep_a001_{DDMM}/{job}/
# ---------------------------------------------------------------------------
experiment: "seed_sweep_${alpha_suffix:}"
descriptor: at_pretrained

defaults:
  - override /born: legendre/d3r20c64
  - override /dataset: ucr_ts/ecg200
  - override /trainer/nll: null
  - override /trainer/adversarial: pgd_at
  - override /tracking: online

# Required on the CLI: best clean (alpha=0) checkpoint for this bond dim.
model_path: ???

tracking:
  seed: 42

trainer:
  adversarial:
    alpha: 0.01
    max_epoch: 800
    batch_size: 100
    patience: 200
    stop_crit: "rob"
    eval_rob_freq: 5
    save: true
    norm_control:
      hard_every: 0
      soft_strength: 1e-3    # fixed in hpo/clean_weight.yaml, not swept
      log_target: null
      debug: false
    optimizer:
      name: "adam"
      kwargs:
        lr: 2e-4             # fixed in hpo/clean_weight.yaml, not swept
        weight_decay: 0.0
    # NOT from this arch's own HPO: hpo/cw_a001_2807 for r20 never finished (only the
    # cw=0.0 job ran). Transferred from the six completed cw studies on these two
    # datasets, where the grid is flat to within 1-3 valid samples and 0.2 is
    # top-or-tied in five of them. Revisit if the r20 study is ever completed.
    clean_weight: 0.2

hydra:
  sweeper:
    params:
      tracking.seed: range(1, 6)
