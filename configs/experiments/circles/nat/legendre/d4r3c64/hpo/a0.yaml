# @package _global_
# ---------------------------------------------------------------------------
# circles / nat / legendre / d4r3c64 -- a0
#
# MIGRATED, NOT RUN. Repointed onto the complex64 born configs when the 2-D toys
# moved off real dtype; no sweep has been launched from this file since. The
# lr/weight_decay below were tuned against the REAL-DTYPE model of the same
# shape, so treat them as a starting point, not as this config's HPO winner.
#
# Selection rule is as it was before the migration and is NOT the unified
# mixed_loss rule the spirals ladder uses (Phase 2, issue B). If this dataset is
# ever run for the paper, unify it first.
# ---------------------------------------------------------------------------
stage: hpo
experiment: a0

descriptor: nat_cold
defaults:
  - override /born: legendre/d4r3c64
  - override /dataset: 2Dtoy/circles
  - override /trainer/adversarial: null
  - override /tracking: online
  - override /hydra/sweeper: optuna

tracking:
  seed: 42
dataset:
  split_seed: 11
  gen_dow_kwargs:
    seed: 25

trainer:
  nll:
    max_epoch: 300
    batch_size: 256
    patience: 300
    stop_crit: "dis_loss"
    save: false
    optimizer:
      name: "adam"
      kwargs:
        lr: 1e-4
        weight_decay: 0.0

hydra:
  sweeper:
    study_name: "${experiment}_${dataset.name}"
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: 42
      n_startup_trials: 10
    direction: minimize
    n_trials: 30
    n_jobs: 1
    params:
      trainer.nll.optimizer.kwargs.lr: tag(log, interval(1e-4, 5e-2))
      trainer.nll.optimizer.kwargs.weight_decay: tag(log, interval(1e-9, 1e-1))
