# @package _global_
experiment: seed_sweep_a0

defaults:
  - override /born: legendre/d6r4
  - override /dataset: 2Dtoy/circles
  - override /trainer/adversarial: null
  - override /tracking: online

tracking:
  seed: 42
dataset:
  split_seed: 11
  gen_dow_kwargs:
    seed: 25

trainer:
  nll:
    max_epoch: 100
    batch_size: 256
    patience: 100
    stop_crit: "dis_loss"
    save: true
    optimizer:
      name: "adam"
      kwargs:
        lr: 0.04489889473473751    # FILL FROM HPO
        weight_decay: 5.635602497291151e-07  # FILL FROM HPO

hydra:
  sweeper:
    params:
      tracking.seed: range(1,21)
