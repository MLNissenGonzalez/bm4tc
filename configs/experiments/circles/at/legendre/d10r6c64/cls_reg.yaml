# @package _global_
# ---------------------------------------------------------------------------
# circles / at / legendre / d10r6c64 -- cls_reg
#
# MIGRATED, NOT RUN. Repointed onto the complex64 born configs when the 2-D toys
# moved off real dtype; no sweep has been launched from this file since. The
# lr/weight_decay below were tuned against the REAL-DTYPE model of the same
# shape, so treat them as a starting point, not as this config's HPO winner.
#
# Selection rule is as it was before the migration and is NOT the unified
# mixed_loss rule the spirals ladder uses (Phase 2, issue B). If this dataset is
# ever run for the paper, unify it first.
# ---------------------------------------------------------------------------
experiment: cls_reg
descriptor: at_warm

defaults:
  - override /born: legendre/d10r6c64
  - override /dataset: 2Dtoy/circles
  - override /trainer/nll: null
  - override /trainer/adversarial: pgd_at
  - override /tracking: online

model_path: ???   # WAS a real-dtype checkpoint (outputs/circles/nat/legendre/d10r6/seed_sweep_a0_1203/0/models/model);
# invalid for this complex64 config. Refill from a c64 alpha=0 sweep
# with tools/patch_checkpoint.py before running.
dataset:
  split_seed: 11
  gen_dow_kwargs:
    seed: 25

tracking:
  seed: 42
  evasion:
    norm: 2
    criterion:
      name: "negative log-likelihood"
      kwargs:
    eps_rel: [0.1]   # 10% of the input domain; abs 0.2 on legendre (width 2.0)
    num_steps: 10
    step_size: null
    random_start: true

trainer:
  adversarial:
    max_epoch: 1            # placeholder; swept via hydra sweeper
    batch_size: 256
    stop_crit: "rob"
    patience: 100           # >= max max_epoch -> no early stopping during sweep

    evasion:
      norm: 2
      criterion:
        name: "negative log-likelihood"
        kwargs:
      eps_rel: [0.1]   # 10% of the input domain; abs 0.2 on legendre (width 2.0)
      num_steps: 10
      step_size: null
      random_start: true

    curriculum: false
    curriculum_eps_start_rel: 0.0
    curriculum_end_epoch: null
    save: true
    auto_stack: true
    auto_unbind: false

    optimizer:
      name: "adam"
      kwargs:
        lr: 0.0001329291894316216                  # FILL FROM HPO
        weight_decay: 0.04033800832600378        # FILL FROM HPO
    clean_weight: 0.7855951534491241  
hydra:
  sweeper:
    params:
      trainer.adversarial.max_epoch: choice(1,2,4,8,16,32,64,128)
      tracking.seed: range(1,6)
