# @package _global_
experiment: seed_sweep_a1

defaults:
  - override /born: hermite/d30r18
  - override /dataset: 2Dtoy/spirals_small
  - override /trainer/nll: test
  - override /trainer/adversarial: null
  - override /tracking: online

tracking:
  seed: 42
dataset:
  split_seed: 11
  gen_dow_kwargs:
    seed: 25

trainer:
  nll:
    alpha: 1.0
    max_epoch: 1000
    batch_size: 256
    patience: 1000
    stop_crit: "gen_loss"
    save: true
    optimizer:
      name: "adam"
      kwargs:
        lr: 0.002052965878622491    # FILL FROM HPO
        weight_decay: 6.440506131248972e-05  # FILL FROM HPO

hydra:
  sweeper:
    params:
      tracking.seed: range(1,21)
