# @package _global_
# ---------------------------------------------------------------------------
# General adversarial-training (AT) HPO for italypowerdemand, with alpha>=0 support.
#
# One config covers every bond dimension AND every alpha. Like hpo_pretrained,
# AT fine-tunes from the best clean (alpha=0) checkpoint supplied via
# `model_path`. The alpha sets the *training* objective on adversarial (and
# clean) examples: alpha*gen + (1-alpha)*dis. It is passed on the CLI and folded
# into the `experiment` token via `alpha_suffix`, so each alpha lands in its own
# output/analysis folder (e.g. alpha=0.5 -> hpo_a05). Bond dim via `born`.
#
# Note: the PGD attack keeps its discriminative NLL criterion (inherited from
# pgd_at); only the training objective is mixed. Norm control mirrors the NAT
# hpo_pretrained ladder: soft_strength is swept jointly with lr (log_target=null
# pins log_Z to the pretrained, normalized start) to keep log_Z stable for
# alpha>0.
#
# Usage (alpha and matching model_path required):
#   python -m experiments.train --multirun \
#       +experiments=italypowerdemand/at/legendre/hpo \
#       born=legendre/d3r60c64 \
#       trainer.adversarial.alpha=0.5 \
#       model_path=outputs/italypowerdemand/nat/legendre/d3r60c64/hpo_a0_{DDMM}/0/models/model
#
#   # large r: add a smaller batch size
#   ... born=legendre/d3r100c64 trainer.adversarial.batch_size=64 ...
#
# Output:  outputs/italypowerdemand/at/legendre/d3r{R}c64/hpo_a{X}_{DDMM}/{job}/
# ---------------------------------------------------------------------------
experiment: "hpo_${alpha_suffix:}"
descriptor: at_pretrained

defaults:
  - override /born: legendre/d3r60c64
  - override /dataset: ucr_ts/italypowerdemand
  - override /trainer/nll: null
  - override /trainer/adversarial: pgd_at
  - override /tracking: online
  - override /hydra/sweeper: optuna

# Required on the CLI: best clean (alpha=0) checkpoint for the chosen bond dim.
model_path: ???

tracking:
  seed: 42

trainer:
  adversarial:
    alpha: 0.0
    max_epoch: 800
    batch_size: 100
    patience: 200
    stop_crit: "rob"
    eval_rob_freq: 5
    save: false
    norm_control:
      hard_every: 0
      soft_strength: 1.0
      log_target: null
      debug: false
    optimizer:
      name: "adam"
      kwargs:
        lr: 1e-5
        weight_decay: 0.0

hydra:
  sweeper:
    study_name: "${experiment}_${dataset.name}"
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: 42
      n_startup_trials: 6
    direction: minimize
    n_trials: 20
    n_jobs: 1
    params:
      trainer.adversarial.optimizer.kwargs.lr: tag(log, interval(1e-6, 5e-4))
      trainer.adversarial.clean_weight: interval(0.0, 1.0)
      trainer.adversarial.norm_control.soft_strength: tag(log, interval(0.1, 100.0))
