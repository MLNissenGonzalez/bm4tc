# @package _global_
# ---------------------------------------------------------------------------
# Cold-start seed sweep (10 seeds) for italypowerdemand at legendre/d3r10c64, alpha=1.0.
#
# Same setup as the HPO that selected these hyperparameters
# (italypowerdemand/nat/legendre/hpo/cold.yaml): flat-prior start (randn_eye), norm control
# targeting the flat-prior log-norm, overflow-safe accumulate. lr and
# soft_strength are the winning trial of
# outputs/italypowerdemand/nat/legendre/d3r10c64/hpo/cold_a1_1007/ (30 TPE trials, scored
# on MIN mixed_loss/valid over history -- not the last-epoch summary).
#
# Seeds are range(1, 11) to match this dataset's alpha=0 seed sweep, so alpha=0
# and alpha>0 are compared at equal n.
#
# NOTE: the winning trial's soft_strength is 3.40816e-09 -- effectively zero, i.e. norm
# control is off. It is baked verbatim (it IS the HPO winner), but if you want a
# live norm penalty, the best trial with a non-negligible soft_strength is
# lr=8.472e-4, soft_strength=3.8481e-3 (4.9% worse on mixed_loss/valid).
#
# Runnable as-is (born and all HPs are baked in):
#   python -m experiments.train --multirun \
#       +experiments=italypowerdemand/nat/legendre/d3r10c64/seed_sweep/cold_a1
#
# Output:  outputs/italypowerdemand/nat/legendre/d3r10c64/seed_sweep/cold_a1_{DDMM}/{job}/
# ---------------------------------------------------------------------------
stage: seed_sweep
experiment: cold_a1
descriptor: nll_cold

defaults:
  - override /born: legendre/d3r10c64
  - override /dataset: ucr_ts/italypowerdemand
  - override /trainer/adversarial: null
  - override /tracking: online

tracking:
  seed: 42

born:
  accumulate: true                             # overflow-safe amplitudes ON

trainer:
  nll:
    alpha: 1.0
    max_epoch: 1000
    batch_size: 512
    patience: 100
    stop_crit: "mixed_loss"
    save: true
    norm_control:
      hard_every: 0
      soft_strength: 3.40816e-09   # FROM HPO cold_a1
      log_target: "n_features * log(in_dim) / 2"   # flat-prior log-norm
      debug: false
    optimizer:
      name: "adam"
      kwargs:
        lr: 0.00103751   # FROM HPO cold_a1
        weight_decay: 0.0

hydra:
  sweeper:
    params:
      tracking.seed: range(1, 11)
