# @package _global_
experiment: seed_sweep_a0

defaults:
  - override /born: legendre/d10r6
  - override /dataset: 2Dtoy/circles_small
  - override /trainer/adversarial: null
  - override /tracking: online

tracking:
  seed: 42
dataset:
  split_seed: 11
  gen_dow_kwargs:
    seed: 25

trainer:
  nll:
    max_epoch: 300
    batch_size: 256
    patience: 300
    stop_crit: "dis_loss"
    save: true
    optimizer:
      name: "adam"
      kwargs:
        lr: 0.017649715848175724                  # FILL FROM HPO
        weight_decay: 4.997040685255816e-08        # FILL FROM HPO

hydra:
  sweeper:
    params:
      tracking.seed: range(1,21)
