# @package _global_
experiment: seed_sweep_mixed_alpha05
descriptor: alpha05

defaults:
  - override /born: legendre/d10r6
  - override /dataset: 2Dtoy/circles
  - override /trainer/discriminative: null
  - override /trainer/generative: test
  - override /trainer/ganstyle: null
  - override /trainer/adversarial: null
  - override /tracking: online

tracking:
  seed: 42
dataset:
  split_seed: 11
  gen_dow_kwargs:
    seed: 25

trainer:
  generative:
    max_epoch: 300
    batch_size: 256
    patience: 300
    stop_crit: "gen_loss"
    save: true
    norm_control:
      target: 1.0
      hard_every: 0
      soft_strength: 0.0
    optimizer:
      name: "adam"
      kwargs:
        lr: 0.0009227734409479708           # FILL FROM HPO
        weight_decay: 2.05e-9  # FILL FROM HPO
    criterion:
      name: "mixed_nll"
      kwargs: {eps: 1e-8, alpha: 0.5}
    metrics: {"genloss": 1, "acc": 1, "clsloss": 1}

hydra:
  sweep:
    dir: outputs/seed_sweep/gen/legendre/d10r6/circles_4k_${now:%d%m}
    subdir: ${hydra.job.num}
  sweeper:
    params:
      tracking.seed: range(1, 21)
