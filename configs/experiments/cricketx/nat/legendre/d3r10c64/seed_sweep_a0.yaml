# @package _global_
experiment: seed_sweep

defaults:
  - override /born: legendre/d3r10c64
  - override /dataset: ucr_ts/cricketx
  - override /trainer/adversarial: null
  - override /tracking: online

tracking:
  seed: 42

trainer:
  nll:
    max_epoch: 800
    batch_size: 100
    patience: 300
    stop_crit: "acc"
    save: true
    optimizer:
      name: "adam"
      kwargs:
        lr: 9.935765726949015e-05    # FILL FROM HPO
        weight_decay: 7.896552638359285e-10  # FILL FROM HPO

hydra:
  sweeper:
    params:
      tracking.seed: range(1,11)
