# @package _global_
experiment: seed_sweep_soft_a1
descriptor: nll_soft_pretrained

defaults:
  - override /born: legendre/d5r100c64
  - override /dataset: ucr_ts/cricketx
  - override /trainer/adversarial: null
  - override /tracking: online

model_path: ???  # FILL: best cls seed sweep checkpoint

tracking:
  seed: 42

trainer:
  nll:
    alpha: 1.0
    max_epoch: 1000
    batch_size: 128
    patience: 300
    stop_crit: "acc"
    save: true
    norm_control:
      log_target: null        # captured from pretrained BM at start of train()
      hard_every: 0
      soft_strength: ???  # FILL FROM GRID SWEEP
    optimizer:
      name: "adam"
      kwargs:
        lr: ???           # FILL FROM GRID SWEEP
        weight_decay: 0.0

hydra:
  sweep:
    dir: outputs/cricketx/nat/legendre/d5r100c64/seed_sweep_soft_a1_${now:%d%m}
    subdir: ${hydra.job.num}
  sweeper:
    params:
      tracking.seed: range(1, 4)
