# @package _global_
stage: hpo
experiment: at

defaults:
  - override /born: legendre/d3r20c64
  - override /dataset: mnist/mnist_full_r12
  - override /trainer/nll: null
  - override /trainer/adversarial: pgd_at
  - override /tracking: online
  - override /hydra/sweeper: optuna

# Fill in path to trained seed_sweep_a0 run before launching
model_path: outputs/mnist_full_r12/nat/legendre/d3r20c64/seed_sweep/a0_DDMM/0/models/model

tracking:
  seed: 42
  evasion:
    norm: "inf"
    method: "PGD"
    criterion:
      name: "negative log-likelihood"
    strengths: [0.3]   # L-inf, abs eps = 0.3 x range_size(2.0) = 0.3 in [0,1] pixel space
    num_steps: 10
    step_size: null
    random_start: true

trainer:
  adversarial:
    max_epoch: 100
    batch_size: 512
    stop_crit: "rob"
    patience: 10
    eval_rob_freq: 5
    acc_floor: 0.90   # only select epochs whose clean valid-acc stays >= 90%

    evasion:
      norm: "inf"
      criterion:
        name: "negative log-likelihood"
      strengths: [0.3]   # standard MNIST L-inf budget (Madry et al.)
      num_steps: 10
      step_size: null
      random_start: true

    curriculum: true
    curriculum_start: 0.01
    curriculum_end_epoch: 70

    save: false
    auto_stack: true
    auto_unbind: false

hydra:
  sweeper:
    storage: null
    study_name: "${experiment}_${dataset.name}"
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: 42
      n_startup_trials: 10
    direction: minimize
    n_trials: 30
    n_jobs: 1
    params:
      trainer.adversarial.optimizer.kwargs.lr: tag(log, interval(1e-5, 1e-2))
      trainer.adversarial.optimizer.kwargs.weight_decay: tag(log, interval(1e-9, 1e-1))
      trainer.adversarial.clean_weight: interval(0.2, 1.0)
