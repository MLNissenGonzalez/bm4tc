# @package _global_
experiment: seed_sweep

defaults:
  - override /born: legendre/d3r20c64
  - override /dataset: mnist/mnist_full_r12
  - override /trainer/nll: null
  - override /trainer/adversarial: pgd_at
  - override /tracking: online

# Fill in path to trained seed_sweep_a0 run before launching
model_path: outputs/mnist_full_r12/nat/legendre/d3r20c64/seed_sweep_a0_DDMM/0/models/model

tracking:
  seed: 42
  evasion:
    norm: "inf"
    method: "PGD"
    criterion:
      name: "negative log-likelihood"
    strengths: [0.3]   # L-inf, abs eps = 0.3 x range_size(2.0) = 0.3 in [0,1] pixel space
    num_steps: 10
    step_size: null
    random_start: true

trainer:
  adversarial:
    max_epoch: 100
    batch_size: 512
    stop_crit: "rob"
    patience: 10
    eval_rob_freq: 5
    acc_floor: 0.90   # only select epochs whose clean valid-acc stays >= 90%
    save: true

    evasion:
      norm: "inf"
      criterion:
        name: "negative log-likelihood"
      strengths: [0.3]   # standard MNIST L-inf budget (Madry et al.)
      num_steps: 10
      step_size: null
      random_start: true

    curriculum: true
    curriculum_start: 0.01
    curriculum_end_epoch: 70

    auto_stack: true
    auto_unbind: false

    optimizer:
      kwargs:
        lr: 0.00040535440816193645          # (higher than 96% acc). FILL FROM HPO
        weight_decay: 0.00007457459568644689  # FILL FROM HPO
    clean_weight: 0.4210913468712624      # FILL FROM HPO

hydra:
  sweeper:
    params:
      tracking.seed: range(1, 6)
