# @package _global_
# ---------------------------------------------------------------------------
# Cheap adversarial-training HPO for mnist_full_r12, alpha>=0: grid over
# learning rate ONLY, at fixed soft_strength and fixed clean_weight.
#
# One config covers every bond dim AND every alpha (both CLI overrides). Like
# the NAT warm-start ladder, AT fine-tunes from the best clean (alpha=0)
# checkpoint supplied via `model_path`. Alpha sets the *training* objective on
# adversarial (and clean) examples: alpha*gen + (1-alpha)*dis; the PGD attack
# keeps its discriminative NLL criterion, inherited from pgd_at.
#
# NOTE on the fixed values:
#   * soft_strength=1e-3 is carried over from the NAT warm-start analysis
#     (240 trials, d3r{10,20,40}c64), where the objective was flat across
#     ~6 decades. AT has a different objective (adv + clean_weight*clean), so
#     this remains an untested extrapolation across trainer type.
#   * clean_weight=0.2 comes from re-analysing the 27 finished trials of the r20
#     Optuna study (hpo_1306_2003) on MAX rob/valid, after dropping 4 collapsed
#     runs (acc ~ chance) and 1 gradient-masking artifact (rob 0.948 ~ acc 0.981
#     at wd=4e-2; an identical-config duplicate scored 0.173). Robustness falls
#     steadily with clean_weight -- mean rob 0.5550 at cw 0.2-0.3 vs 0.2726 at
#     cw 0.6-1.0, for ~0.4% clean accuracy -- so the previously used 0.421 was
#     measurably suboptimal. corr(clean_weight, rob) = -0.664.
#
# clean_weight matters MORE than lr here (corr -0.664 vs -0.200), so for the
# cheap alpha in {0, 0.01} runs at r10-r40 prefer the sibling config
# hpo/clean_weight.yaml, which sweeps clean_weight at fixed lr instead.
#
# Evasion budget follows the existing mnist AT config: L-inf, strength 0.3 as a
# fraction of range_size(2.0), i.e. the standard 0.3 MNIST budget (Madry et al.)
# in [0,1] pixel space.
#
# Usage (alpha, born and matching model_path all required):
#   python -m experiments.train --multirun \
#       +experiments=mnist_full_r12/at/legendre/hpo/grid \
#       born=legendre/d3r40c64 \
#       trainer.adversarial.alpha=0.1 \
#       model_path=outputs/mnist_full_r12/nat/legendre/d3r40c64/seed_sweep/a0_{DDMM}/{job}/models/model
#
# Output:  outputs/mnist_full_r12/at/legendre/d3r{R}c64/hpo/grid_a{X}_{DDMM}/{job}/
# ---------------------------------------------------------------------------
stage: hpo
experiment: "grid_${alpha_suffix:}"
descriptor: at_pretrained

defaults:
  - override /born: legendre/d3r10c64        # CLI-overridden: born=legendre/d3r{10,20,40,60,100}c64
  - override /dataset: mnist/mnist_full_r12
  - override /trainer/nll: null
  - override /trainer/adversarial: pgd_at
  - override /tracking: online

# Required on the CLI: best clean (alpha=0) NAT checkpoint for this bond dim.
model_path: ???

tracking:
  seed: 42
  evasion:
    norm: "inf"
    method: "PGD"
    criterion:
      name: "negative log-likelihood"
    strengths: [0.1]   # relative; abs eps = 0.1 x 2.0 = 0.2 in [-1,1]
    num_steps: 10
    step_size: null
    random_start: true

trainer:
  adversarial:
    alpha: 0.0               # CLI-overridden: trainer.adversarial.alpha={0,0.01,0.1,0.2,0.5,1.0}
    max_epoch: 100
    batch_size: 512
    patience: 10
    stop_crit: "rob"
    eval_rob_freq: 5
    acc_floor: 0.90          # only select epochs whose clean valid-acc stays >= 90%
    save: false

    evasion:
      norm: "inf"
      criterion:
        name: "negative log-likelihood"
      strengths: [0.1]       # relative; abs eps = 0.2 in [-1,1]
      num_steps: 10
      step_size: null
      random_start: true

    curriculum: true
    curriculum_start: 0.01
    curriculum_end_epoch: 70

    auto_stack: true
    auto_unbind: false

    norm_control:
      hard_every: 0
      soft_strength: 1e-3    # FIXED -- extrapolated from NAT, see caveat above
      log_target: null
      debug: false

    clean_weight: 0.2      # FIXED -- best region of the re-analysed r20 AT study

    optimizer:
      name: "adam"
      kwargs:
        lr: 3e-4             # overridden by the grid below
        weight_decay: 0.0

hydra:
  sweeper:
    params:
      # Bracketed to the AT plateau measured on the r20 study: mean rob 0.52-0.56
      # over 1.5e-4..7e-4, falling to 0.370 over 7e-4..1.5e-3, with outright
      # collapse (acc ~ chance) at every trial above 2.7e-3. The NAT grid's
      # 1.2e-3 upper point is therefore dropped for AT.
      trainer.adversarial.optimizer.kwargs.lr: choice(1e-4, 2e-4, 4e-4, 7e-4)
