# @package _global_
# ---------------------------------------------------------------------------
# Adversarial-training seed sweep (3 seeds) for mnist_full_r12 at legendre/d3r10c64,
# alpha=0.01, with the SPLIT objective (gen_on_clean=true). Fine-tunes from the
# best clean (alpha=0) NAT checkpoint.
#
# RADIUS: eps_rel=0.1 (abs 0.2 in [-1,1]), the corrected training radius. The
# published a001_2607 sweep trained at eps_rel=0.3 (abs 0.6) -- the Madry 28x28
# MNIST convention, which does not transfer to 12x12 downsampled data where a
# given L-inf budget removes far more class information.
#
# SPLIT OBJECTIVE: the adversarial signal enters the discriminative term only and
# the generative half sees clean data,
#     L = (1-a)*[(1-cw)*L_dis(x_adv) + cw*L_dis(x)] + a*L_gen(x)
# versus the default (1-cw)*mixed_nll(x_adv) + cw*mixed_nll(x). clean_weight now
# mixes INSIDE the discriminative term, so the cw_a001 grid's answer (0.2) does
# not transfer even though the number would look familiar.
#
# clean_weight=0.1, uniform across r10/r20/r40, from the cw_split_a001 grid HPO
# selected on MAX rob/valid subject to acc_floor=0.90. TWO CAVEATS: that grid ran
# at eps_rel=0.3, not the 0.1 used here, and its cw=0.4 trial never completed.
# Reused rather than re-tuned per the "no new HPO" constraint. cw=0.1 led at both
# bond dims the grid covers (r10 0.5485 vs 0.5436 at cw=0; r20 0.5759 vs 0.5733)
# and cw=0.2 fell below cw=0 at both, so cw=0.4 was very unlikely to win.
#
# lr=3e-4 and soft_strength=1e-3 are the fixed values used throughout the AT/NAT
# grids. batch_size=512 is unchanged from a001_2607 on purpose: the radius and the
# split are meant to be the only differences from the published sweep.
#
# VALIDATION CADENCE: gen_on_clean routes validation through eval_split, which runs
# every eval_rob_freq epochs and nothing in between, and patience counts validation
# EVENTS. patience=10 at eval_rob_freq=5 therefore means 50 epochs without
# improvement, not 10.
#
# ROB IS A SUBSET ESTIMATOR HERE: the split draws a fixed (1-cw)=90% slice of the
# valid set for the attack (logged as n_rob_valid), so rob/valid is not exactly
# comparable to the a0 sweeps' full-valid rob. This affects model selection and the
# W&B curves only -- reported test robustness comes from analysis/sweep.py over the
# full test set.
#
# 3 seeds, not 5: seed sd on the published AT sweeps is ~0.002-0.008 in rob/valid
# against bond-dim effects of 0.05-0.08, so n=3 costs ~0.001 of standard error.
#
# Runnable as-is (born, model_path, and all HPs are baked in):
#   python -m experiments.train --multirun \
#       +experiments=mnist_full_r12/at/legendre/d3r10c64/seed_sweep/a001
# ---------------------------------------------------------------------------
stage: seed_sweep
experiment: a001
descriptor: at_pretrained

defaults:
  - override /born: legendre/d3r10c64
  - override /dataset: mnist/mnist_full_r12
  - override /trainer/nll: null
  - override /trainer/adversarial: pgd_at
  - override /tracking: online

# Best clean (alpha=0) NAT checkpoint for this bond dim.
model_path: outputs/mnist_full_r12/nat/legendre/d3r10c64/seed_sweep/a0_2406/4/models/model

tracking:
  seed: 42
  evasion:
    norm: "inf"
    method: "PGD"
    criterion:
      name: "negative log-likelihood"
    eps_rel: [0.1]   # relative; abs eps = 0.1 x 2.0 = 0.2 in [-1,1]
    num_steps: 10
    step_size: null
    random_start: true

trainer:
  adversarial:
    alpha: 0.01
    gen_on_clean: true       # adversarial signal in the discriminative term only
    max_epoch: 100
    batch_size: 512
    patience: 10
    stop_crit: "rob"
    eval_rob_freq: 5
    acc_floor: 0.90          # only select epochs whose clean valid-acc stays >= 90%
    save: true

    evasion:
      norm: "inf"
      criterion:
        name: "negative log-likelihood"
      eps_rel: [0.1]       # relative; abs eps = 0.2 in [-1,1]
      num_steps: 10
      step_size: null
      random_start: true

    curriculum: true
    curriculum_eps_start_rel: 0.01
    curriculum_end_epoch: 70

    auto_stack: true
    auto_unbind: false

    norm_control:
      hard_every: 0
      soft_strength: 1e-3    # FIXED -- flat over ~6 decades in the NAT studies
      log_target: null
      debug: false

    clean_weight: 0.1        # FIXED -- cw_split_a001 HPO winner (see caveats in header)

    optimizer:
      name: "adam"
      kwargs:
        lr: 3e-4             # FIXED -- centre of the AT plateau (1.5e-4..7e-4)
        weight_decay: 0.0

hydra:
  sweeper:
    params:
      tracking.seed: range(1, 4)
