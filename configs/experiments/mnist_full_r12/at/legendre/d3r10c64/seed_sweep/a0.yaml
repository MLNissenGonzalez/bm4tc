# @package _global_
# ---------------------------------------------------------------------------
# Adversarial-training seed sweep (5 seeds) for mnist_full_r12 at legendre/d3r10c64,
# alpha=0. Fine-tunes from the best clean (alpha=0) NAT checkpoint.
#
# clean_weight=0.0, uniform across r10/r20/r40, from the cw_a0 grid HPO
# (hpo/clean_weight.yaml) selected on MAX rob/valid subject to acc_floor=0.90.
# Lower cw is better across the board: r20/r40 pick 0.0 outright, and r10's
# nominal best 0.1 edged 0.0 by <0.003 rob (within noise) -- so cw=0 is used
# everywhere for a clean bond-dim comparison. lr=3e-4 and soft_strength=1e-3
# are the fixed values used throughout the AT/NAT grids.
#
# Runnable as-is (born, model_path, and all HPs are baked in):
#   python -m experiments.train --multirun \
#       +experiments=mnist_full_r12/at/legendre/d3r10c64/seed_sweep/a0
# ---------------------------------------------------------------------------
stage: seed_sweep
experiment: a0
descriptor: at_pretrained

defaults:
  - override /born: legendre/d3r10c64
  - override /dataset: mnist/mnist_full_r12
  - override /trainer/nll: null
  - override /trainer/adversarial: pgd_at
  - override /tracking: online

# Best clean (alpha=0) NAT checkpoint for this bond dim.
model_path: outputs/mnist_full_r12/nat/legendre/d3r10c64/seed_sweep/a0_2406/4/models/model

tracking:
  seed: 42
  evasion:
    norm: "inf"
    method: "PGD"
    criterion:
      name: "negative log-likelihood"
    strengths: [0.1]   # relative; abs eps = 0.1 x 2.0 = 0.2 in [-1,1]
    num_steps: 10
    step_size: null
    random_start: true

trainer:
  adversarial:
    alpha: 0.0
    max_epoch: 100
    batch_size: 512
    patience: 10
    stop_crit: "rob"
    eval_rob_freq: 5
    acc_floor: 0.90          # only select epochs whose clean valid-acc stays >= 90%
    save: true

    evasion:
      norm: "inf"
      criterion:
        name: "negative log-likelihood"
      strengths: [0.1]       # relative; abs eps = 0.2 in [-1,1]
      num_steps: 10
      step_size: null
      random_start: true

    curriculum: true
    curriculum_start: 0.01
    curriculum_end_epoch: 70

    auto_stack: true
    auto_unbind: false

    norm_control:
      hard_every: 0
      soft_strength: 1e-3    # FIXED -- flat over ~6 decades in the NAT studies
      log_target: null
      debug: false

    clean_weight: 0.0       # FIXED -- uniform cw=0 across bond dims (r10 best 0.1
                            # edged 0.0 by <0.003 rob, within noise; r20/r40 prefer 0.0)

    optimizer:
      name: "adam"
      kwargs:
        lr: 3e-4             # FIXED -- centre of the AT plateau (1.5e-4..7e-4)
        weight_decay: 0.0

hydra:
  sweeper:
    params:
      tracking.seed: range(1, 6)
