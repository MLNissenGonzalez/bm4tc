# @package _global_
stage: seed_sweep
experiment: a05
descriptor: nll_pretrained

defaults:
  - override /born: legendre/d3r20c64
  - override /dataset: mnist/mnist_full_r12
  - override /trainer/adversarial: null
  - override /tracking: online

# Warm start: fill in path to best norm-controlled a0 seed-sweep run before launching
model_path: outputs/mnist_full_r12/nat/legendre/d3r20c64/seed_sweep/a0_2406/2/models/model

tracking:
  seed: 42

trainer:
  nll:
    alpha: 0.5
    max_epoch: 100
    batch_size: 512
    patience: 50
    stop_crit: "mixed_loss"
    save: true
    norm_control:
      hard_every: 0
      soft_strength: 0.002477763101770804   # FILL FROM HPO (hpo/pretrained_a05)
      log_target: null
      debug: false
    optimizer:
      name: "adam"
      kwargs:
        lr: 0.0004157082163009855            # FILL FROM HPO (hpo/pretrained_a05)
        weight_decay: 0.0

hydra:
  sweeper:
    params:
      tracking.seed: range(1, 6)
