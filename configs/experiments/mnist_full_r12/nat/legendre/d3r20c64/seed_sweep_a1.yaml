# @package _global_
experiment: seed_sweep_a1
descriptor: nll_pretrained

defaults:
  - override /born: legendre/d3r20c64
  - override /dataset: mnist/mnist_full_r12
  - override /trainer/adversarial: null
  - override /tracking: online

# Fill in path to trained seed_sweep_a0 run before launching
model_path: outputs/mnist_full_r12/nat/legendre/d3r20c64/seed_sweep_a0_DDMM/0/models/model

tracking:
  seed: 42

trainer:
  nll:
    alpha: 1.0
    max_epoch: 100
    batch_size: 512
    patience: 50
    stop_crit: "mixed_loss"
    save: true
    norm_control:
      hard_every: 0
      soft_strength: 18.850155865330542
      log_target: null
      debug: false
    optimizer:
      name: "adam"
      kwargs:
        lr: 0.000004786164322487482
        weight_decay: 0.0

hydra:
  sweeper:
    params:
      tracking.seed: range(1, 6)
