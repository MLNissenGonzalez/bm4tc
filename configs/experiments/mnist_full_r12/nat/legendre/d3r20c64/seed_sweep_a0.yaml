# @package _global_
experiment: seed_sweep_a0
descriptor: nll

defaults:
  - override /born: legendre/d3r20c64
  - override /dataset: mnist/mnist_full_r12
  - override /trainer/adversarial: null
  - override /tracking: online

tracking:
  seed: 42

trainer:
  nll:
    alpha: 0.0
    max_epoch: 300
    batch_size: 512
    patience: 60
    stop_crit: "acc"
    save: true
    norm_control:
      hard_every: 0
      soft_strength: 0.0
    optimizer:
      name: "adam"
      kwargs:
        lr: 0.0001025350969016849
        weight_decay: 0.0

hydra:
  sweeper:
    params:
      tracking.seed: range(1, 6)
