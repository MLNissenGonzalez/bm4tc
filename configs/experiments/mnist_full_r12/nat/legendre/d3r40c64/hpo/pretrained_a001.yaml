# @package _global_
stage: hpo
experiment: pretrained_a001
descriptor: nll_pretrained

defaults:
  - override /born: legendre/d3r40c64
  - override /dataset: mnist/mnist_full_r12
  - override /trainer/adversarial: null
  - override /tracking: online
  - override /hydra/sweeper: optuna

# Warm start: fill in path to best norm-controlled a0 seed-sweep run before launching
model_path: outputs/mnist_full_r12/nat/legendre/d3r40c64/seed_sweep/a0_DDMM/0/models/model

tracking:
  seed: 42

trainer:
  nll:
    alpha: 0.01
    max_epoch: 100
    batch_size: 512
    patience: 50
    stop_crit: "mixed_loss"
    save: false
    norm_control:
      hard_every: 0
      soft_strength: 1.0
      log_target: null
      debug: false
    optimizer:
      name: "adam"
      kwargs:
        lr: 1e-5
        weight_decay: 0.0

hydra:
  sweeper:
    study_name: "${experiment}_${dataset.name}"
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: 42
      n_startup_trials: 6
    direction: minimize
    n_trials: 16
    n_jobs: 1
    params:
      trainer.nll.optimizer.kwargs.lr: tag(log, interval(1e-6, 5e-4))
      trainer.nll.norm_control.soft_strength: tag(log, interval(1e-6, 1e2))
