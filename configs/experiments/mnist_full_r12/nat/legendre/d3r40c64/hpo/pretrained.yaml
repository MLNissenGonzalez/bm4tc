# @package _global_
# ---------------------------------------------------------------------------
# General alpha>0 (generative, pretrained) HPO for mnist_full_r12 at legendre/d3r40c64.
#
# One config covers every alpha>0. The alpha is passed on the CLI and is folded
# into the `experiment` token via the `alpha_suffix` resolver, so each alpha
# lands in its own output/analysis folder (e.g. alpha=0.5 -> pretrained_a05).
#
# Fine-tunes from the best alpha=0 (a0) checkpoint, supplied via `model_path`.
# Sweeps learning rate and soft_strength.
#
# Usage (alpha and matching model_path are required):
#   python -m experiments.train --multirun \
#       +experiments=mnist_full_r12/nat/legendre/d3r40c64/hpo/pretrained \
#       trainer.nll.alpha=0.5 \
#       model_path=outputs/mnist_full_r12/nat/legendre/d3r40c64/seed_sweep/a0_{DDMM}/0/models/model
#
# Output:  outputs/mnist_full_r12/nat/legendre/d3r40c64/hpo/pretrained_a{X}_{DDMM}/{job}/
# ---------------------------------------------------------------------------
stage: hpo
experiment: "pretrained_${alpha_suffix:}"
descriptor: nll_pretrained

defaults:
  - override /born: legendre/d3r40c64
  - override /dataset: mnist/mnist_full_r12
  - override /trainer/adversarial: null
  - override /tracking: online
  - override /hydra/sweeper: optuna

# Required on the CLI: best norm-controlled a0 seed-sweep checkpoint.
model_path: ???

tracking:
  seed: 42

trainer:
  nll:
    alpha: 0.5
    max_epoch: 100
    batch_size: 512
    patience: 50
    stop_crit: "mixed_loss"
    save: false
    norm_control:
      hard_every: 0
      soft_strength: 1.0
      log_target: null
      debug: false
    optimizer:
      name: "adam"
      kwargs:
        lr: 1e-5
        weight_decay: 0.0

hydra:
  sweeper:
    study_name: "${experiment}_${dataset.name}"
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: 42
      n_startup_trials: 6
    direction: minimize
    n_trials: 16
    n_jobs: 1
    params:
      trainer.nll.optimizer.kwargs.lr: tag(log, interval(1e-6, 5e-4))
      trainer.nll.norm_control.soft_strength: tag(log, interval(1e-6, 1e2))
