# @package _global_
stage: seed_sweep
experiment: a0
descriptor: nll

defaults:
  - override /born: legendre/d3r10c64
  - override /dataset: mnist/mnist_full_r12
  - override /trainer/adversarial: null
  - override /tracking: online

tracking:
  seed: 42

trainer:
  nll:
    alpha: 0.0
    max_epoch: 300
    batch_size: 512
    patience: 60
    stop_crit: "acc"
    save: true
    norm_control:
      hard_every: 0
      soft_strength: ???   # FILL FROM HPO (hpo/a0)
      log_target: "n_features * log(in_dim) / 2"
      debug: false
    optimizer:
      name: "adam"
      kwargs:
        lr: ???            # FILL FROM HPO (hpo/a0)
        weight_decay: 0.0

hydra:
  sweeper:
    params:
      tracking.seed: range(1, 6)
