# @package _global_
experiment: hpo_a1

descriptor: nll
defaults:
  - override /born: legendre/d3r60c64
  - override /dataset: mnist/mnist_full_r12
  - override /trainer/adversarial: null
  - override /tracking: online
  - override /hydra/sweeper: optuna

tracking:
  seed: 42

trainer:
  nll:
    alpha: 1.0
    max_epoch: 300
    batch_size: 64
    patience: 60
    stop_crit: "gen_loss"
    save: false
    norm_control:
      hard_every: 1
      soft_strength: 0.0
      log_target: "log(in_dim) * n_features"
    optimizer:
      name: "adam"
      kwargs:
        lr: 1e-4
        weight_decay: 0.0

hydra:
  sweeper:
    study_name: "${experiment}_${dataset.name}"
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: 42
      n_startup_trials: 4
    direction: minimize
    n_trials: 8
    n_jobs: 1
    params:
      trainer.nll.optimizer.kwargs.lr: tag(log, interval(1e-6, 1e-3))
