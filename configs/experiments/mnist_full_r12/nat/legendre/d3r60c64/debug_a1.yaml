# @package _global_
experiment: debug_a1

descriptor: nll
defaults:
  - override /born: legendre/d3r60c64
  - override /dataset: mnist/mnist_full_r12
  - override /trainer/adversarial: null
  - override /tracking: test

tracking:
  seed: 42

trainer:
  nll:
    alpha: 1.0
    max_epoch: 5
    batch_size: 64
    patience: 60
    stop_crit: "gen_loss"
    save: false
    norm_control:
      hard_every: 1
      soft_strength: 0.0
      log_target: 0.0
    optimizer:
      name: "adam"
      kwargs:
        lr: 5e-5
        weight_decay: 0.0
