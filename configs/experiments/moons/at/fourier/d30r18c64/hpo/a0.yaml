# @package _global_
# ---------------------------------------------------------------------------
# moons / at / fourier / d30r18c64 -- a0
#
# MIGRATED, NOT RUN. Repointed onto the complex64 born configs when the 2-D toys
# moved off real dtype; no sweep has been launched from this file since. The
# lr/weight_decay below were tuned against the REAL-DTYPE model of the same
# shape, so treat them as a starting point, not as this config's HPO winner.
#
# Selection rule is as it was before the migration and is NOT the unified
# mixed_loss rule the spirals ladder uses (Phase 2, issue B). If this dataset is
# ever run for the paper, unify it first.
# ---------------------------------------------------------------------------
stage: hpo
experiment: a0
descriptor: at_warm

defaults:
  - override /born: fourier/d30r18c64
  - override /dataset: 2Dtoy/moons
  - override /trainer/nll: null
  - override /trainer/adversarial: pgd_at
  - override /tracking: online
  - override /hydra/sweeper: optuna

model_path: ???

dataset:
  split_seed: 11
  gen_dow_kwargs:
    seed: 25

tracking:
  seed: 42
  evasion:
    norm: 2
    criterion:
      name: "negative log-likelihood"
    eps_rel: [0.15]
    num_steps: 10
    step_size: null
    random_start: true

trainer:
  adversarial:
    max_epoch: 300
    batch_size: 256
    stop_crit: "rob"
    patience: 300

    evasion:
      norm: 2
      criterion:
        name: "negative log-likelihood"
      eps_rel: [0.15]
      num_steps: 10
      step_size: null
      random_start: true

    curriculum: true
    curriculum_eps_start_rel: 0.01
    curriculum_end_epoch: 200

    save: false
    auto_stack: true
    auto_unbind: false

hydra:
  sweeper:
    storage: null
    study_name: "${experiment}_${dataset.name}"
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: 42
      n_startup_trials: 10
    direction: minimize
    n_trials: 30
    n_jobs: 1
    params:
      trainer.adversarial.optimizer.kwargs.lr: tag(log, interval(1e-5, 1e-2))
      trainer.adversarial.optimizer.kwargs.weight_decay: tag(log, interval(1e-9, 1e-1))
      trainer.adversarial.clean_weight: interval(0.2, 1.0)
