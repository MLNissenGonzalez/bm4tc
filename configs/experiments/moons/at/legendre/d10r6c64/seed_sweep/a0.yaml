# @package _global_
# ---------------------------------------------------------------------------
# moons / at / legendre / d10r6c64 -- a0
#
# MIGRATED, NOT RUN. Repointed onto the complex64 born configs when the 2-D toys
# moved off real dtype; no sweep has been launched from this file since. The
# lr/weight_decay below were tuned against the REAL-DTYPE model of the same
# shape, so treat them as a starting point, not as this config's HPO winner.
#
# Selection rule is as it was before the migration and is NOT the unified
# mixed_loss rule the spirals ladder uses (Phase 2, issue B). If this dataset is
# ever run for the paper, unify it first.
# ---------------------------------------------------------------------------
stage: seed_sweep
experiment: a0
descriptor: at_warm

defaults:
  - override /born: legendre/d10r6c64
  - override /dataset: 2Dtoy/moons
  - override /trainer/nll: null
  - override /trainer/adversarial: pgd_at
  - override /tracking: online

model_path: outputs/moons/nat/legendre/d10r6/seed_sweep_a0_2804/3/models/model

dataset:
  split_seed: 11
  gen_dow_kwargs:
    seed: 25

tracking:
  seed: 42
  evasion:
    norm: 2
    criterion:
      name: "negative log-likelihood"
    eps_rel: [0.1]
    num_steps: 10
    step_size: null
    random_start: true

trainer:
  adversarial:
    max_epoch: 300
    batch_size: 256
    stop_crit: "rob"
    patience: 300

    evasion:
      norm: 2
      criterion:
        name: "negative log-likelihood"
      eps_rel: [0.1]
      num_steps: 10
      step_size: null
      random_start: true

    curriculum: true
    curriculum_eps_start_rel: 0.01
    curriculum_end_epoch: 200

    save: true
    auto_stack: true
    auto_unbind: false

    optimizer:
      kwargs:
        lr: 0.0026596125782230844                  # FILL FROM HPO
        weight_decay: 9.086899297662124e-09        # FILL FROM HPO
    clean_weight: 0.323829472428861            # FILL FROM HPO

hydra:
  sweeper:
    params:
      tracking.seed: range(1,9)
