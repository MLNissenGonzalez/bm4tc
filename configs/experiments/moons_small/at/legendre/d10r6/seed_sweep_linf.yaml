# @package _global_
experiment: seed_sweep_linf

defaults:
  - override /born: legendre/d10r6
  - override /dataset: 2Dtoy/moons_small
  - override /trainer/nll: null
  - override /trainer/adversarial: pgd_at
  - override /tracking: online

model_path: outputs/moons_small/nat/legendre/d10r6/seed_sweep_a0_2804/3/models/model

dataset:
  split_seed: 11
  gen_dow_kwargs:
    seed: 25

tracking:
  seed: 42
  evasion:
    norm: inf
    criterion:
      name: "negative log-likelihood"
    eps_rel: [0.1]
    num_steps: 10
    step_size: null
    random_start: true

trainer:
  adversarial:
    max_epoch: 1000
    batch_size: 256
    stop_crit: "rob"
    patience: 1000

    evasion:
      norm: inf
      criterion:
        name: "negative log-likelihood"
      eps_rel: [0.1]
      num_steps: 10
      step_size: null
      random_start: true

    curriculum: true
    curriculum_eps_start_rel: 0.01
    curriculum_end_epoch: 80

    save: true
    auto_stack: true
    auto_unbind: false

    optimizer:
      kwargs:
        lr: ???                                    # FILL FROM HPO
        weight_decay: ???                          # FILL FROM HPO
    clean_weight: ???                              # FILL FROM HPO

hydra:
  sweeper:
    params:
      tracking.seed: range(1,21)
