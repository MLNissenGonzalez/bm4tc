# @package _global_
experiment: seed_sweep_a1

defaults:
  - override /born: chebychev1/d30r18
  - override /dataset: 2Dtoy/spirals
  - override /trainer/nll: test
  - override /trainer/adversarial: null
  - override /tracking: online

tracking:
  seed: 42
dataset:
  split_seed: 11
  gen_dow_kwargs:
    seed: 25

trainer:
  nll:
    alpha: 1.0
    max_epoch: 150
    batch_size: 256
    patience: 150
    stop_crit: "gen_loss"
    save: true
    optimizer:
      name: "adam"
      kwargs:
        lr: 0.0008747616469163509    # FILL FROM HPO
        weight_decay: 7.813648003448602e-09  # FILL FROM HPO

hydra:
  sweeper:
    params:
      tracking.seed: range(1,21)
