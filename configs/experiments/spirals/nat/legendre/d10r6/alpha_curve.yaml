# @package _global_
experiment: alpha_curve

defaults:
  - override /born: legendre/d10r6
  - override /dataset: 2Dtoy/spirals
  - override /trainer/nll: test
  - override /trainer/adversarial: null
  - override /tracking: online

tracking:
  seed: 42

dataset:
  split_seed: 11
  gen_dow_kwargs:
    seed: 25

trainer:
  nll:
    alpha: 0.1
    max_epoch: 300
    batch_size: 256
    patience: 300
    stop_crit: "gen_loss"
    save: true
    norm_control:
      target: 1.0
      hard_every: 0
      soft_strength: 0.0
    optimizer:
      name: "adam"
      kwargs:
        lr: ${geom_lr:${trainer.nll.alpha},0.04360959649429807,0.0034928234571149435}  # geom interp; resolver in experiments/generative.py
        weight_decay: 0.0

hydra:
  sweeper:
    params:
      trainer.nll.alpha: choice(0.0, 1e-2, 1e-1, 2e-1, 3e-1, 4e-1, 5e-1, 7e-1, 9e-1, 1.0)
      tracking.seed: range(1, 6)

