# @package _global_
# ---------------------------------------------------------------------------
# alpha=0 (purely discriminative) NAT HPO for spirals, legendre, complex64.
#
# The alpha=0 base of the ladder. It is trained from scratch like every cold
# alpha>0 arm, so its descriptor is nat_cold too -- but it carries no cold_
# prefix, because alpha=0 is the base both ladders are defined against and
# "cold_a0" would be the only sensible name for a thing that has no warm
# counterpart. See CLAUDE.md, "Warm/cold prefix".
#
# stop_crit=mixed_loss, which at alpha=0 reduces exactly to dis_loss. One
# selection rule covers the whole ladder -- that is the point of Phase 2 (issue
# B in the consistency register: every arm previously used a different rule).
#
# SEARCH SPACE IS DELIBERATELY IDENTICAL across every alpha and every arch:
# lr log-uniform over (1e-6, 1e-1), 30 trials. The old spirals studies used
# five different lr intervals with no rationale and two winners pressed against
# their bound (issues C1/C2), so per-arm tuning of the search space is the
# defect being removed, not a knob to re-open.
#
# Usage (loop the arch):
#   for r in 4r3 6r4 10r6; do
#     python -m experiments.train --multirun \
#       +experiments=spirals/nat/legendre/hpo/a0 born=legendre/d${r}c64
#   done
#
# Output: outputs/spirals/nat/legendre/d{A}c64/hpo/a0_{DDMM}/
# ---------------------------------------------------------------------------
stage: hpo
experiment: a0
descriptor: nat_cold

defaults:
  - override /born: legendre/d10r6c64        # CLI-overridden: born=legendre/d{4r3,6r4,10r6}c64
  - override /dataset: 2Dtoy/spirals
  - override /trainer/adversarial: null
  - override /tracking: online
  - override /hydra/sweeper: optuna

tracking:
  seed: 42

dataset:
  split_seed: 11
  gen_dow_kwargs:
    seed: 25

trainer:
  nll:
    alpha: 0.0
    max_epoch: 300
    batch_size: 256
    patience: 100
    stop_crit: "mixed_loss"       # == dis_loss at alpha=0
    save: false
    norm_control:
      hard_every: 0
      soft_strength: 0.1
      log_target: 0.0
      debug: false
    optimizer:
      name: "adam"
      kwargs:
        lr: 1e-4                  # swept below
        weight_decay: 0.0         # FIXED at 0 for every arm (uniform search space)

hydra:
  sweeper:
    study_name: "${experiment}_${dataset.name}_d${born.init_kwargs.in_dim}r${born.init_kwargs.bond_dim}"
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: 42
      n_startup_trials: 10
    direction: minimize
    n_trials: 30
    n_jobs: 1
    params:
      trainer.nll.optimizer.kwargs.lr: tag(log, interval(1e-6, 1e-1))
