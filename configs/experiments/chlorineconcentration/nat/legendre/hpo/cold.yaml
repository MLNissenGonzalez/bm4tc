# @package _global_
# ---------------------------------------------------------------------------
# Cold-start alpha>0 HPO (NOT pretrained) with overflow-safe accumulate=true.
# The model starts at the flat prior (randn_eye init, from the born config) and
# norm control targets the flat-prior log-norm; HPO tunes the learning rate and
# the soft norm-control strength. Alpha and bond dim are CLI overrides — loop
# them per dataset.
#
# Usage (loop alpha x bond dim for this dataset):
#   for a in 0.01 0.1 0.2 0.5 1.0; do for r in 10 20; do
#     python -m experiments.train --multirun \
#       +experiments=chlorineconcentration/nat/legendre/hpo/cold \
#       trainer.nll.alpha=$a born=legendre/d3r${r}c64
#   done; done
#
# Output: outputs/chlorineconcentration/nat/legendre/d3r{R}c64/hpo/cold_a{X}_{DDMM}/
# ---------------------------------------------------------------------------
stage: hpo
experiment: "cold_${alpha_suffix:}"
descriptor: nll_cold

defaults:
  - override /born: legendre/d3r10c64          # CLI-overridden: born=legendre/d3r{10,20}c64
  - override /dataset: ucr_ts/chlorineconcentration
  - override /trainer/adversarial: null
  - override /tracking: online
  - override /hydra/sweeper: optuna

tracking:
  seed: 42

born:
  accumulate: true                             # overflow-safe amplitudes ON

trainer:
  nll:
    alpha: 0.01                                # CLI-overridden: trainer.nll.alpha=...
    max_epoch: 1000
    batch_size: 512
    patience: 100
    stop_crit: "mixed_loss"                    # HPO objective (minimize); == gen_loss at alpha=1
    save: false
    norm_control:
      hard_every: 0
      soft_strength: 1.0                        # swept below
      log_target: "n_features * log(in_dim) / 2"   # flat-prior log-norm
      debug: false
    optimizer:
      name: "adam"
      kwargs:
        lr: 1e-4                                # swept below
        weight_decay: 0.0

hydra:
  sweeper:
    study_name: "${experiment}_${dataset.name}_r${born.init_kwargs.bond_dim}"
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: 42
      n_startup_trials: 10
    direction: minimize
    n_trials: 30
    n_jobs: 1
    params:
      trainer.nll.optimizer.kwargs.lr: tag(log, interval(1e-6, 1e-2))
      trainer.nll.norm_control.soft_strength: tag(log, interval(1e-9, 1e2))
