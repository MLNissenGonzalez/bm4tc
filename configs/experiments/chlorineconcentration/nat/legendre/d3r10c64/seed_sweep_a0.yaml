# @package _global_
experiment: seed_sweep_a0

defaults:
  - override /born: legendre/d3r10c64
  - override /dataset: ucr_ts/chlorineconcentration
  - override /trainer/adversarial: null
  - override /tracking: online

tracking:
  seed: 42

trainer:
  nll:
    max_epoch: 800
    batch_size: 100
    patience: 300
    stop_crit: "acc"
    save: true
    optimizer:
      name: "adam"
      kwargs:
        lr: 0.00050304    # FILL FROM HPO
        weight_decay: 0.0  # FILL FROM HPO
    norm_control:
      soft_strength: 0.0000019055
      hard_every: 0
hydra:
  sweeper:
    params:
      tracking.seed: range(1,11)
