# @package _global_
experiment: seed_sweep
descriptor: cls

defaults:
  - override /born: legendre/d3r120c64
  - override /dataset: mnist/mnist_full
  - override /trainer/adversarial: null
  - override /tracking: online

tracking:
  seed: 42

trainer:
  nll:
    max_epoch: 150
    batch_size: 16
    patience: 50
    stop_crit: "acc"
    save: true
    optimizer:
      name: "adam"
      kwargs:
        lr: ???  # FILL FROM HPO
        weight_decay: 0.0

hydra:
  sweep:
    dir: outputs/mnist_full/nat/legendre/d3r120c64/seed_sweep_a0_${now:%d%m}
    subdir: ${hydra.job.num}
  sweeper:
    params:
      tracking.seed: range(1, 6)
