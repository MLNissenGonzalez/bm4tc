# @package _global_
experiment: seed_sweep
descriptor: nll_hard_pretrained

defaults:
  - override /born: legendre/d3r120c64
  - override /dataset: mnist/mnist_full
  - override /trainer/adversarial: null
  - override /tracking: online

model_path: ???  # FILL: best cls seed sweep checkpoint

tracking:
  seed: 42

trainer:
  nll:
    alpha: 1.0
    max_epoch: 1000
    batch_size: 16
    patience: 300
    stop_crit: "acc"
    save: true
    norm_control:
      target: null        # captured from pretrained BM at start of train()
      hard_every: ???     # FILL FROM GRID SWEEP
      soft_strength: 0.0
    optimizer:
      name: "adam"
      kwargs:
        lr: ???           # FILL FROM GRID SWEEP
        weight_decay: 0.0

hydra:
  sweep:
    dir: outputs/mnist_full/nat/legendre/d3r120c64/seed_sweep_hard_a1_${now:%d%m}
    subdir: ${hydra.job.num}
  sweeper:
    params:
      tracking.seed: range(1, 4)
