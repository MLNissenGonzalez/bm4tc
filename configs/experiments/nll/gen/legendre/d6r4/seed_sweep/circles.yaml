# @package _global_
experiment: seed_sweep

defaults:
  - override /born: legendre/d6r4
  - override /dataset: 2Dtoy/circles
  - override /trainer/nll: test
  - override /trainer/adversarial: null
  - override /tracking: online

tracking:
  seed: 42
dataset:
  split_seed: 11
  gen_dow_kwargs:
    seed: 25

trainer:
  nll:
    alpha: 1.0
    max_epoch: 100
    batch_size: 256
    patience: 100
    stop_crit: "gen_loss"
    save: true
    optimizer:
      name: "adam"
      kwargs:
        lr: 0.0018396315037360197    # FILL FROM HPO
        weight_decay: 4.064662762487197e-08  # FILL FROM HPO

hydra:
  sweeper:
    params:
      tracking.seed: range(1,21)
