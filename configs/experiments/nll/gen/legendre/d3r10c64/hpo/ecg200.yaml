# @package _global_
experiment: hpo_scratch
descriptor: nll_scratch

defaults:
  - override /born: legendre/d3r10c64
  - override /dataset: ucr_ts/ecg200
  - override /trainer/discriminative: null       # no warm-start
  - override /trainer/adversarial: null
  - override /tracking: online
  - override /hydra/sweeper: optuna

tracking:
  seed: 42

trainer:
  nll:
    alpha: 1.0
    max_epoch: 1000
    batch_size: 128
    patience: 200
    stop_crit: "gen_loss"
    save: false
    optimizer:
      name: "adam"
      kwargs:
        lr: 1e-4
        weight_decay: 0.0

hydra:
  sweeper:
    study_name: "hpo_scratch_${dataset.name}"
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: 42
      n_startup_trials: 5
    direction: minimize
    n_trials: 20
    n_jobs: 1
    params:
      trainer.nll.optimizer.kwargs.lr: tag(log, interval(1e-5, 1e-2))
      trainer.nll.optimizer.kwargs.weight_decay: tag(log, interval(1e-9, 1e-1))
