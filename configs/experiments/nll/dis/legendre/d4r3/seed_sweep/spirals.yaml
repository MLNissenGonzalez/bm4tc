# @package _global_
experiment: seed_sweep

defaults:
  - override /born: legendre/d4r3
  - override /dataset: 2Dtoy/spirals
  - override /trainer/adversarial: null
  - override /tracking: online

tracking:
  seed: 42
dataset:
  split_seed: 11
  gen_dow_kwargs:
    seed: 25

trainer:
  nll:
    max_epoch: 300
    batch_size: 256
    patience: 300
    stop_crit: "dis_loss"
    save: true
    optimizer:
      name: "adam"
      kwargs:
        lr: 0.041376293143363094
        weight_decay: 1.2037019480116324e-05

hydra:
  sweeper:
    params:
      tracking.seed: range(1,21)
