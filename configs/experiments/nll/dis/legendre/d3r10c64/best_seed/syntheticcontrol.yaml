# @package _global_
experiment: best_seed

defaults:
  - override /born: legendre/d3r10c64
  - override /dataset: ucr_ts/syntheticcontrol
  - override /trainer/adversarial: null
  - override /tracking: online

tracking:
  seed: 4  # FILL: best seed from wandb

trainer:
  nll:
    max_epoch: 800
    batch_size: 100
    patience: 300
    stop_crit: "acc"
    save: true
    optimizer:
      name: "adam"
      kwargs:
        lr: 0.0008322724281704736
        weight_decay: 1.9185136028649245e-07
