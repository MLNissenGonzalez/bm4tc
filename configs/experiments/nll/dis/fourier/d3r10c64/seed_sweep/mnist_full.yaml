# @package _global_
experiment: seed_sweep

defaults:
  - override /born: fourier/d3r10c64
  - override /dataset: mnist/mnist_full
  - override /trainer/adversarial: null
  - override /tracking: online

tracking:
  seed: 42

trainer:
  nll:
    max_epoch: 30
    batch_size: 500
    patience: 30
    stop_crit: "acc"
    save: true
    optimizer:
      name: "adam"
      kwargs:
        lr: ???    # FILL FROM HPO
        weight_decay: ???  # FILL FROM HPO

hydra:
  sweeper:
    params:
      tracking.seed: range(1,21)
