# @package _global_
experiment: seed_sweep
descriptor: mixed_scratch

defaults:
  - override /born: legendre/d10r6
  - override /dataset: 2Dtoy/moons
  - override /trainer/nll: test
  - override /trainer/adversarial: null
  - override /tracking: online

tracking:
  seed: 42

dataset:
  split_seed: 11
  gen_dow_kwargs:
    seed: 25

trainer:
  nll:
    alpha: 0.1
    max_epoch: 300
    batch_size: 256
    patience: 300
    stop_crit: "gen_loss"
    save: true
    norm_control:
      target: 1.0
      hard_every: 0
      soft_strength: 0.0
    optimizer:
      name: "adam"
      kwargs:
        lr: ???           # FILL FROM GRID SWEEP
        weight_decay: 0.0

hydra:
  sweep:
    dir: outputs/seed_sweep/gen/legendre/d10r6/moons_4k_${now:%d%m}
    subdir: ${hydra.job.num}
  sweeper:
    params:
      tracking.seed: range(1, 6)
