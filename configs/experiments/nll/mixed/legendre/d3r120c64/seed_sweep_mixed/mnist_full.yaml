# @package _global_
experiment: seed_sweep
descriptor: mixed_scratch

defaults:
  - override /born: legendre/d3r120c64
  - override /dataset: mnist/mnist_full
  - override /trainer/adversarial: null
  - override /tracking: online

tracking:
  seed: 42

trainer:
  nll:
    alpha: 0.1
    max_epoch: 1000
    batch_size: 16
    patience: 300
    stop_crit: "acc"
    save: true
    norm_control:
      target: 1.0
      hard_every: 0
      soft_strength: 0.0
    optimizer:
      name: "adam"
      kwargs:
        lr: ???           # FILL FROM GRID SWEEP
        weight_decay: 0.0

hydra:
  sweep:
    dir: outputs/seed_sweep/gen/legendre/d3r120c64/mnist_full_${now:%d%m}
    subdir: ${hydra.job.num}
  sweeper:
    params:
      tracking.seed: range(1, 4)
