# The bm4tc environment, pinned to the versions the test suite passes with.
#
#   conda env create -f environment.yml        # new env "bm4tc"
#   conda env update -f environment.yml --prune  # bring an existing one in line
#
# Everything but Python comes from PyPI, so conda and pip never mix packages.
# torch 2.1.0 wheels bundle the CUDA 12.1 runtime (needs an NVIDIA driver >= 530);
# numpy stays < 2 because torch 2.1 is built against numpy 1.x.
name: bm4tc
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      - torch==2.1.0
      - torchvision==0.16.0        # MNIST download
      - tensorkrowch==1.1.6
      - opt_einsum==3.2.0
      - numpy==1.25.2
      - scipy==1.15.3
      - scikit-learn==1.7.2
      - pandas==2.3.3
      - matplotlib==3.10.9
      - tqdm==4.70.0
      - pyyaml==6.0.3
      - hydra-core==1.3.7          # config composition only (D56); no Hydra launchers or sweepers
      - omegaconf==2.3.1
      - optuna==5.0.0              # >= 3.1 for JournalFile storage (D62)
      - wandb==0.30.0
      - pytest==9.1.1
      - jupyter==1.1.1
      - ipykernel==7.3.0
