hydra:
  run:
    dir: ${jem_outputs_root:}/baselines/jem/${dataset.name}/${jem_regime_dir:${regime}}/${model.name}/${stage}/${run_name}_${now:%d%m_%H%M}
  sweep:
    dir: ${jem_outputs_root:}/baselines/jem/${dataset.name}/${jem_regime_dir:${regime}}/${model.name}/${stage}/${run_name}_${now:%d%m}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params:
      tracking.seed: range(1, 6)
      trainer.optimizer.kwargs.lr: '0.0009822036655933496'
      trainer.clean_weight: '0.007141025907089427'
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: MULTIRUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=MULTIRUN
    task:
    - tracking.seed=2
    - trainer.optimizer.kwargs.lr=0.0009822036655933496
    - trainer.clean_weight=0.007141025907089427
    - +experiment=seed_sweep/at
    - model_path=outputs/baselines/jem/mnist_full_r12/nat/mlp_h550x480/seed_sweep/a0_2607/2/models/model.pt
  job:
    name: train
    chdir: null
    override_dirname: +experiment=seed_sweep/at,model_path=outputs/baselines/jem/mnist_full_r12/nat/mlp_h550x480/seed_sweep/a0_2607/2/models/model.pt,tracking.seed=2,trainer.clean_weight=0.007141025907089427,trainer.optimizer.kwargs.lr=0.0009822036655933496
    id: '1'
    num: 1
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.4
    version_base: '1.3'
    cwd: /Users/jose/VSCodeProjects/bm4tc
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /Users/jose/VSCodeProjects/bm4tc/baselines/jem/configs
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /Users/jose/VSCodeProjects/bm4tc/outputs/baselines/jem/mnist_full_r12/at/mlp_h550x480/seed_sweep/at_2707/1
    choices:
      experiment: seed_sweep/at
      tracking: online
      validation_sampler: default
      sampler: default
      trainer: at
      model: mlp_r20_real_dof
      dataset: mnist_full_r12
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
