hydra:
  run:
    dir: ${jem_outputs_root:}/baselines/jem/${dataset.name}/${jem_regime_dir:${regime}}/${model.name}/${stage}/${run_name}_${now:%d%m_%H%M}
  sweep:
    dir: ${jem_outputs_root:}/baselines/jem/${dataset.name}/${jem_regime_dir:${regime}}/${model.name}/${stage}/${run_name}_${now:%d%m}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params:
      tracking.seed: range(1, 6)
      trainer.optimizer.kwargs.lr: '0.0019643589897305577'
      trainer.optimizer.kwargs.weight_decay: '1.8756206282287313e-06'
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: MULTIRUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=MULTIRUN
    task:
    - +experiment=seed_sweep/a0
  job:
    name: train
    chdir: null
    override_dirname: +experiment=seed_sweep/a0
    id: ???
    num: ???
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.4
    version_base: '1.3'
    cwd: /Users/jose/VSCodeProjects/bm4tc
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /Users/jose/VSCodeProjects/bm4tc/baselines/jem/configs
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: ???
    choices:
      experiment: seed_sweep/a0
      tracking: online
      validation_sampler: default
      sampler: default
      trainer: natural
      model: mlp_r20_real_dof
      dataset: mnist_full_r12
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
run_name: a0
stage: seed_sweep
regime: natural
model_path: null
device: auto
dataset:
  name: mnist_full_r12
  gen_dow_kwargs:
    name: mnist_full
    size: null
    seed: 42
    noise: null
    circ_factor: null
    dow_link: null
    resize: 12
  split:
  - 0.8
  - 0.1
  - 0.1
  split_seed: 42
  overwrite: false
  scaler: linear
model:
  name: mlp_h550x480
  hidden_dims:
  - 550
  - 480
  activation: silu
  input_range:
  - -1.0
  - 1.0
  match_mps:
    physical_dim: 3
    bond_dim: 20
trainer:
  alpha: 0.0
  max_epoch: 100
  batch_size: 512
  patience: 30
  stop_crit: acc
  input_noise_std: 0.0
  energy_l2: 0.0001
  grad_clip: 10.0
  save: true
  optimizer:
    name: adam
    kwargs:
      lr: 0.0003
      weight_decay: 0.0
sampler:
  num_steps: 20
  step_size: 0.01
  noise_std: 0.005
  reinit_probability: 0.05
  buffer_size: 10000
  track_diagnostics: true
validation_sampler:
  num_steps: 100
  step_size: 0.05
  noise_std: 0.005
  reinit_probability: 0.1
  buffer_size: 2048
  batch_size: 256
  num_batches: 4
  seed: 12345
tracking:
  project: bm4tc
  entity: martin-nissen-gonzalez-heidelberg-university
  mode: online
  seed: 42
